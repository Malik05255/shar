name: Generate Hunyuan3D 2.1 PBR Hero - 130s Free Fork

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-hunyuan21-130s-textured.yml'

permissions:
  contents: read
  actions: read

jobs:
  hunyuan21-pbr-130s:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HERO_REFERENCE_RUN_ID: '33391759260'
      HERO_REFERENCE_ARTIFACT: Runtime3D-photorealistic-hero-reference-candidate
      HERO_REFERENCE_FILE: police_dog.hero_reference.fullbody.png
      SPACE: imagine-io-webinar/image-to-3d
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enforce free candidate-only policy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo '::error::HF_TOKEN missing'; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('runtime3d/manifest.json').read_text())
          assert m.get('enabled') is False
          print('FREE_ONLY=true')
          print('PAID_FALLBACK=false')
          print('PRODUCTION_ACTIVATION=false')
          print('TARGET_SPACE=imagine-io-webinar/image-to-3d')
          PY

      - name: Download exact approved hero reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HERO_REFERENCE_ARTIFACT }}
          path: ${{ runner.temp }}/hero-reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HERO_REFERENCE_RUN_ID }}

      - name: Verify exact reference
        shell: bash
        run: |
          set -euo pipefail
          REF="$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE"
          test -s "$REF"
          (( $(stat -c%s "$REF") >= 10000 ))
          file "$REF"

      - name: Install Gradio client
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2'

      - name: Generate Hunyuan 2.1 geometry-aware textured candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hunyuan21-130s"
          python3 runtime3d/hf_hunyuan21_textured_reference.py \
            --space "$SPACE" \
            --reference "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE" \
            --output "$RUNNER_TEMP/hunyuan21-130s/police_dog.hunyuan21.130s.pbr.glb" \
            --report "$RUNNER_TEMP/hunyuan21-130s/police_dog.hunyuan21.130s.pbr.json"

      - name: Validate textured GLB contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'runtime3d')
          from inspect_glb import read_glb_json
          root=Path(os.environ['RUNNER_TEMP'])/'hunyuan21-130s'
          glb=root/'police_dog.hunyuan21.130s.pbr.glb'
          report=json.loads((root/'police_dog.hunyuan21.130s.pbr.json').read_text())
          d=read_glb_json(glb)
          acc=d.get('accessors') or []
          vertices=0
          for mesh in d.get('meshes') or []:
              for prim in mesh.get('primitives') or []:
                  p=(prim.get('attributes') or {}).get('POSITION')
                  if isinstance(p,int) and 0 <= p < len(acc): vertices += int(acc[p].get('count') or 0)
          mats=d.get('materials') or []; tex=d.get('textures') or []; imgs=d.get('images') or []
          channels=report.get('pbrChannels') or []
          result={'bytes':glb.stat().st_size,'vertices':vertices,'materials':len(mats),'textures':len(tex),'images':len(imgs),'channels':channels,'space':report.get('space')}
          print(json.dumps(result,indent=2))
          assert report.get('space') == 'imagine-io-webinar/image-to-3d'
          assert report.get('freeOnly') is True and report.get('paidFallbackAllowed') is False
          assert report.get('productionReady') is False
          if vertices < 100000: raise SystemExit('Geometry quality floor failed')
          if not mats or not tex or not imgs or 'baseColorTexture' not in channels: raise SystemExit('PBR payload gate failed')
          print('HUNYUAN21_130S_PBR_STRUCTURAL_GATE=PASS')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Upload Hunyuan 2.1 PBR candidate
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-hunyuan21-130s-pbr-candidate
          path: ${{ runner.temp }}/hunyuan21-130s/*
          if-no-files-found: error
          retention-days: 14

      - name: Keep production gate closed
        run: |
          echo 'MANUAL_FOUR_VIEW_QC_REQUIRED=true'
          echo 'RIG_DEFORMATION_QC_REQUIRED=true'
          echo 'PHYSICAL_ANDROID_GATE_REQUIRED=true'
          echo 'PRODUCTION_GATE=CLOSED'
