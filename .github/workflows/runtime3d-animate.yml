name: Author Runtime 3D Hero Motion Candidate - Blender Free

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-animate.yml'
      - 'runtime3d/blender_author_candidate_animations.py'
      - 'runtime3d/.animate-run-once'

permissions:
  contents: read
  actions: read

jobs:
  author-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: '33393540203'
      SOURCE_ARTIFACT: Runtime3D-police-dog-blender-autorig-candidate
      SOURCE_GLB: police_dog.blender_autorig.candidate.glb

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Enforce candidate-only quality policy
        shell: bash
        run: |
          set -euo pipefail
          echo 'FREE_ONLY=true'
          echo 'DECIMATION=false'
          echo 'PRODUCTION_ACTIVATION=false'
          echo 'MOTION_CANDIDATE_ONLY=true'

      - name: Download exact successful rig artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ runner.temp }}/rig-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify rig source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/rig-source/$SOURCE_GLB"
          test -s "$SRC"
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'runtime3d')
          from inspect_glb import read_glb_json
          p = Path(os.environ['RUNNER_TEMP'])/'rig-source'/os.environ['SOURCE_GLB']
          d = read_glb_json(p)
          skins = d.get('skins') or []
          joints = max((len(x.get('joints') or []) for x in skins), default=0)
          print(f'rig_source_bytes={p.stat().st_size}')
          print(f'rig_source_skins={len(skins)}')
          print(f'rig_source_max_joints={joints}')
          if len(skins) != 1 or joints < 24:
              raise SystemExit('Rig source structural floor failed')
          PY

      - name: Install free Blender runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender --background --python-expr "import numpy; print('BLENDER_NUMPY=' + numpy.__version__)"

      - name: Author required motion candidate clips
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime3d-motion"
          blender --background \
            --python runtime3d/blender_author_candidate_animations.py -- \
            --input "$RUNNER_TEMP/rig-source/$SOURCE_GLB" \
            --output "$RUNNER_TEMP/runtime3d-motion/police_dog.motion_candidate.glb" \
            --qc "$RUNNER_TEMP/runtime3d-motion/police_dog.motion_candidate.qc.json"

      - name: Validate exact runtime clip names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'runtime3d')
          from inspect_glb import read_glb_json, DOG_CLIPS
          p = Path(os.environ['RUNNER_TEMP'])/'runtime3d-motion'/'police_dog.motion_candidate.glb'
          d = read_glb_json(p)
          names = sorted({a.get('name') for a in (d.get('animations') or []) if a.get('name')})
          missing = sorted(set(DOG_CLIPS) - set(names))
          print(json.dumps({'bytes': p.stat().st_size, 'animationCount': len(names), 'animations': names, 'missing': missing}, indent=2))
          if missing:
              raise SystemExit(f'Missing runtime clips after GLB export: {missing}')
          if len(d.get('skins') or []) != 1:
              raise SystemExit('Motion export lost the skin')
          print('MOTION_NAME_GATE=PASS')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Keep cinematic production gate closed
        shell: bash
        run: |
          set +e
          cp "$RUNNER_TEMP/runtime3d-motion/police_dog.motion_candidate.glb" "$RUNNER_TEMP/runtime3d-motion/police_dog.glb"
          python3 runtime3d/inspect_glb.py "$RUNNER_TEMP/runtime3d-motion/police_dog.glb"
          RC=$?
          if [[ $RC -eq 0 ]]; then
            echo '::error::Production inspector passed too early; materials/facial visual acceptance are still mandatory.'
            exit 1
          fi
          echo 'Expected: production gate remains closed until cinematic PBR/fur/facial/device acceptance.'
          exit 0

      - name: Upload motion candidate and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-police-dog-motion-candidate
          path: ${{ runner.temp }}/runtime3d-motion/*
          if-no-files-found: warn
          retention-days: 14
