name: Probe Upsampler Stable Fast 3D Direct API - CPU Only

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-sf3d-textured-qc.yml'

permissions:
  contents: read
  actions: read

jobs:
  sf3d-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HERO_REFERENCE_RUN_ID: '33391759260'
      HERO_REFERENCE_ARTIFACT: Runtime3D-photorealistic-hero-reference-candidate
      HERO_REFERENCE_FILE: police_dog.hero_reference.fullbody.png
      SF3D_SPACE: Upsampler/stable-fast-3d
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enforce free CPU-only diagnostic gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo '::error::HF_TOKEN is required'; exit 1; }
          echo "PROVIDER=$SF3D_SPACE"
          echo 'GPU_INVOKED=false'
          echo 'FREE_ONLY=true'
          echo 'PAID_FALLBACK=false'
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('runtime3d/manifest.json').read_text()).get('enabled') is False
          print('manifest.enabled=false')
          PY

      - name: Download exact approved hero reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HERO_REFERENCE_ARTIFACT }}
          path: ${{ runner.temp }}/hero-reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HERO_REFERENCE_RUN_ID }}

      - name: Install probe dependencies
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2' 'Pillow>=10,<12' 'numpy>=1.26,<3'

      - name: Probe direct API schema without GPU
        shell: bash
        run: |
          set -euo pipefail
          python3 runtime3d/sf3d_probe.py \
            --space "$SF3D_SPACE" \
            --reference "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE" \
            --work-dir "$RUNNER_TEMP/sf3d-probe"

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-upsampler-sf3d-gradio-probe
          path: ${{ runner.temp }}/sf3d-probe/sf3d-gradio-probe.json
          if-no-files-found: error
          retention-days: 3

      - name: Keep production manifest closed
        run: |
          echo 'GPU_INVOKED=false'
          echo 'PRODUCTION_GATE=CLOSED'
