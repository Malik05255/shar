name: Transfer SF3D PBR to Motion V2 Hero - Free Blender

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-sf3d-transfer.yml'
      - 'runtime3d/blender_transfer_pbr_candidate.py'
      - 'runtime3d/blender_transfer_pbr_embedded.py'
      - 'runtime3d/blender_transfer_pbr_seamsafe.py'
      - 'runtime3d/validate_facial_motion_cubic.py'

permissions:
  contents: read
  actions: read

jobs:
  transfer-pbr-motion-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MOTION_RUN_ID: '33427570106'
      MOTION_ARTIFACT: Runtime3D-police-dog-motion-v2-candidate
      MOTION_GLB: police_dog.motion_v2_candidate.glb
      DONOR_RUN_ID: '33410396487'
      DONOR_ARTIFACT: Runtime3D-sf3d-textured-reference-candidate
      DONOR_GLB: police_dog.sf3d.textured_reference.glb

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enforce free topology-preserving candidate policy
        shell: bash
        run: |
          set -euo pipefail
          echo 'FREE_ONLY=true'
          echo 'PAID_FALLBACK=false'
          echo 'DECIMATION=false'
          echo 'REMESH=false'
          echo 'PRESERVE_SKIN=true'
          echo 'PRESERVE_26_CLIPS=true'
          echo 'PRESERVE_SPARSE_FACE_LAYERS=true'
          echo 'SEAM_SAFE_LOOP_UV=true'
          echo 'PRODUCTION_ACTIVATION=false'
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('runtime3d/manifest.json').read_text())
          assert manifest.get('enabled') is False
          print('manifest.enabled=false')
          PY

      - name: Download validated Motion V2 hero
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOTION_ARTIFACT }}
          path: ${{ runner.temp }}/motion
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MOTION_RUN_ID }}

      - name: Download exact SF3D textured donor
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DONOR_ARTIFACT }}
          path: ${{ runner.temp }}/donor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.DONOR_RUN_ID }}

      - name: Verify immutable Motion V2 and PBR donor inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'runtime3d')
          from inspect_glb import read_glb_json, DOG_CLIPS
          motion=Path(os.environ['RUNNER_TEMP'])/'motion'/os.environ['MOTION_GLB']
          donor=Path(os.environ['RUNNER_TEMP'])/'donor'/os.environ['DONOR_GLB']
          if not motion.is_file() or not donor.is_file(): raise SystemExit('Source artifact missing')
          md=read_glb_json(motion); dd=read_glb_json(donor)
          names={a.get('name') for a in (md.get('animations') or []) if a.get('name')}
          missing=sorted(set(DOG_CLIPS)-names)
          skins=md.get('skins') or []; joints=max((len(s.get('joints') or []) for s in skins),default=0)
          acc=md.get('accessors') or []; vertices=0
          for mesh in md.get('meshes') or []:
              for prim in mesh.get('primitives') or []:
                  pos=(prim.get('attributes') or {}).get('POSITION')
                  if isinstance(pos,int) and 0 <= pos < len(acc): vertices += int(acc[pos].get('count') or 0)
          mats=dd.get('materials') or []; tex=dd.get('textures') or []; imgs=dd.get('images') or []
          base_ok=False; normal_ok=False
          for mat in mats:
              pbr=mat.get('pbrMetallicRoughness') or {}
              base_ok = base_ok or isinstance((pbr.get('baseColorTexture') or {}).get('index'),int)
              normal_ok = normal_ok or isinstance((mat.get('normalTexture') or {}).get('index'),int)
          print(json.dumps({'motionBytes':motion.stat().st_size,'vertices':vertices,'motionAnimations':len(names),
                            'missing':missing,'motionSkins':len(skins),'maxJoints':joints,
                            'donorBytes':donor.stat().st_size,'donorMaterials':len(mats),
                            'donorTextures':len(tex),'donorImages':len(imgs),
                            'donorBaseColor':base_ok,'donorNormal':normal_ok},indent=2))
          if missing or len(names) != 26 or len(skins)!=1 or joints < 32 or vertices < 1_000_000:
              raise SystemExit('Motion V2 structural quality contract failed')
          if len(tex) < 2 or len(imgs) < 2 or not base_ok or not normal_ok:
              raise SystemExit('Donor BaseColor+Normal payload missing')
          PY

      - name: Install Blender and headless GL runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1-mesa-dri
          blender --version | head -n 2

      - name: Hydrate PBR and transfer seam-safe loop UVs onto Motion V2
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: 'surfaceless'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pbr-motion-v2/previews"
          blender --background \
            --python runtime3d/blender_transfer_pbr_seamsafe.py -- \
            --target "$RUNNER_TEMP/motion/$MOTION_GLB" \
            --donor "$RUNNER_TEMP/donor/$DONOR_GLB" \
            --output "$RUNNER_TEMP/pbr-motion-v2/police_dog.motion_v2_pbr_candidate.glb" \
            --qc "$RUNNER_TEMP/pbr-motion-v2/police_dog.motion_v2_pbr_candidate.qc.json" \
            --preview-dir "$RUNNER_TEMP/pbr-motion-v2/previews"
          test -s "$RUNNER_TEMP/pbr-motion-v2/police_dog.motion_v2_pbr_candidate.glb"
          test -s "$RUNNER_TEMP/pbr-motion-v2/police_dog.motion_v2_pbr_candidate.qc.json"
          COUNT=$(find "$RUNNER_TEMP/pbr-motion-v2/previews" -maxdepth 1 -type f -name '*.png' | wc -l)
          [[ "$COUNT" -eq 3 ]] || { echo "::error::Expected 3 QC renders, got $COUNT"; exit 1; }
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          qc=json.loads((Path(os.environ['RUNNER_TEMP'])/'pbr-motion-v2'/'police_dog.motion_v2_pbr_candidate.qc.json').read_text())
          uv=qc.get('uvTransfer') or {}
          if uv.get('algorithm') != 'nearest-donor-triangle + per-target-polygon loop-corner UV':
              raise SystemExit('Seam-safe UV algorithm marker missing')
          if int(uv.get('loopsWritten',0)) != int(uv.get('targetLoops',-1)):
              raise SystemExit('Not all target UV loops were written')
          if int(uv.get('donorUvSeamVertices',0)) <= 0:
              raise SystemExit('Donor seam diagnostics unexpectedly empty')
          if int(uv.get('targetVerticesWithPerLoopUvSplits',0)) <= 0:
              raise SystemExit('Target did not preserve any per-loop UV splits')
          print('SEAM_SAFE_LOOP_UV_GATE=PASS')
          PY

      - name: Validate embedded PBR skin topology and all 26 clips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'runtime3d')
          from inspect_glb import read_glb_json, DOG_CLIPS
          root=Path(os.environ['RUNNER_TEMP'])/'pbr-motion-v2'
          out=root/'police_dog.motion_v2_pbr_candidate.glb'
          qc=json.loads((root/'police_dog.motion_v2_pbr_candidate.qc.json').read_text())
          d=read_glb_json(out)
          names={a.get('name') for a in (d.get('animations') or []) if a.get('name')}
          missing=sorted(set(DOG_CLIPS)-names)
          skins=d.get('skins') or []; joints=max((len(s.get('joints') or []) for s in skins),default=0)
          mats=d.get('materials') or []; tex=d.get('textures') or []; imgs=d.get('images') or []
          pbr_ok=False; normal_ok=False
          for mat in mats:
              pbr=mat.get('pbrMetallicRoughness') or {}
              pbr_ok = pbr_ok or isinstance((pbr.get('baseColorTexture') or {}).get('index'),int)
              normal_ok = normal_ok or isinstance((mat.get('normalTexture') or {}).get('index'),int)
          vb=qc.get('targetVerticesBeforeAfter') or []; pb=qc.get('targetPolygonsBeforeAfter') or []
          print(json.dumps({'bytes':out.stat().st_size,'animations':len(names),'missing':missing,
                            'skins':len(skins),'maxJoints':joints,'materials':len(mats),
                            'textures':len(tex),'images':len(imgs),'baseColorTexture':pbr_ok,
                            'normalTexture':normal_ok,'verticesBeforeAfter':vb,
                            'polygonsBeforeAfter':pb,'previews':qc.get('previewFiles'),
                            'uvTransfer':qc.get('uvTransfer')},indent=2))
          if len(vb)!=2 or vb[0]!=vb[1]: raise SystemExit('Target vertex topology changed')
          if len(pb)!=2 or pb[0]!=pb[1]: raise SystemExit('Target polygon topology changed')
          if missing or len(names)!=26 or len(skins)!=1 or joints < 32: raise SystemExit('Skin/animation preservation failed')
          if not mats or len(tex)<2 or len(imgs)<2 or not pbr_ok or not normal_ok:
              raise SystemExit('Embedded BaseColor+Normal material payload missing')
          if len(qc.get('actionsBefore') or []) != len(qc.get('actionsAfter') or []):
              raise SystemExit('Blender action count changed')
          print('MOTION_V2_PBR_STRUCTURAL_GATE=PASS')
          PY

      - name: Revalidate sparse facial deformation after PBR export
        shell: bash
        run: |
          set -euo pipefail
          python3 runtime3d/validate_facial_motion_cubic.py \
            "$RUNNER_TEMP/pbr-motion-v2/police_dog.motion_v2_pbr_candidate.glb" \
            --report "$RUNNER_TEMP/pbr-motion-v2/police_dog.motion_v2_pbr_candidate.facial.json"
          test -s "$RUNNER_TEMP/pbr-motion-v2/police_dog.motion_v2_pbr_candidate.facial.json"
          echo 'MOTION_V2_PBR_FACIAL_GATE=PASS'
          echo 'PRODUCTION_GATE=CLOSED'

      - name: Upload Motion V2 PBR candidate and QC renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-police-dog-motion-v2-pbr-candidate
          path: ${{ runner.temp }}/pbr-motion-v2/*
          if-no-files-found: warn
          retention-days: 14

      - name: Keep production manifest closed
        if: success()
        run: |
          echo 'MANUAL_VISUAL_QC_REQUIRED=true'
          echo 'ARABIC_LIPSYNC_TIMING_REQUIRED=true'
          echo 'PHYSICAL_ANDROID_GATE_REQUIRED=true'
          echo 'PRODUCTION_GATE=CLOSED'
