name: Generate Textured Hero - Aptol Hunyuan Free Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-aptol-hunyuan-bridge.yml'

permissions:
  contents: read
  actions: read

jobs:
  aptol-hunyuan-texture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HERO_REFERENCE_RUN_ID: '33391759260'
      HERO_REFERENCE_ARTIFACT: Runtime3D-photorealistic-hero-reference-candidate
      HERO_REFERENCE_FILE: police_dog.hero_reference.fullbody.png
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enforce free-only closed production gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo '::error::HF_TOKEN missing'; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('runtime3d/manifest.json').read_text())
          assert m.get('enabled') is False
          print('FREE_ONLY=true')
          print('PAID_FALLBACK=false')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Download exact hero reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HERO_REFERENCE_ARTIFACT }}
          path: ${{ runner.temp }}/hero-reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HERO_REFERENCE_RUN_ID }}

      - name: Verify hero reference
        shell: bash
        run: |
          set -euo pipefail
          REF="$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE"
          test -s "$REF"
          (( $(stat -c%s "$REF") >= 10000 ))
          file "$REF"

      - name: Install bridge client
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2' 'requests>=2.31,<3'

      - name: Run aptol Hunyuan model and texture bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aptol-hunyuan"
          python3 runtime3d/hf_aptol_genshin_bridge.py \
            --reference "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE" \
            --output "$RUNNER_TEMP/aptol-hunyuan/police_dog.aptol_hunyuan.textured.glb" \
            --report "$RUNNER_TEMP/aptol-hunyuan/police_dog.aptol_hunyuan.textured.json"

      - name: Upload retrieved candidate and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-aptol-hunyuan-textured-candidate
          path: ${{ runner.temp }}/aptol-hunyuan/*
          if-no-files-found: warn
          retention-days: 14

      - name: Keep production gate closed
        if: success()
        run: |
          echo 'MANUAL_FOUR_VIEW_QC_REQUIRED=true'
          echo 'RIG_DEFORMATION_QC_REQUIRED=true'
          echo 'PHYSICAL_ANDROID_GATE_REQUIRED=true'
          echo 'PRODUCTION_GATE=CLOSED'
