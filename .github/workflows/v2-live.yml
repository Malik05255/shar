name: Al-Shorti V2 Native Live

on:
  workflow_dispatch:
  push:
    branches:
      - v2/live-native-audio
    paths:
      - 'police-live-v2/**'
      - 'tools/smoke_live_v2.py'
      - '.github/workflows/v2-live.yml'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew*'

concurrency:
  group: alshorti-v2-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY missing'; exit 1; }

      - name: Smoke the real Gemini Live WebSocket
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
        run: |
          python -m pip install --disable-pip-version-check 'websockets>=15,<17'
          python tools/smoke_live_v2.py

      - name: Prepare photoreal reference image
        env:
          MASTER_FRAME_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png
        run: |
          set -euo pipefail
          DIR=police-live-v2/src/main/res/drawable-nodpi
          mkdir -p "$DIR"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 120 \
            "$MASTER_FRAME_URL" --output "$DIR/cinematic_office_reference.png"
          test -s "$DIR/cinematic_office_reference.png"

      - name: Enforce clean-room V2 isolation
        run: |
          set -euo pipefail
          test -d police-live-v2
          grep -q 'gemini-3.1-flash-live-preview' police-live-v2/src/main/kotlin/com/malik/alshurti/livev2/GeminiLiveSession.kt
          grep -q 'BidiGenerateContent' police-live-v2/src/main/kotlin/com/malik/alshurti/livev2/GeminiLiveSession.kt
          grep -q 'AudioRecord' police-live-v2/src/main/kotlin/com/malik/alshurti/livev2/GeminiLiveSession.kt
          grep -q 'AudioTrack' police-live-v2/src/main/kotlin/com/malik/alshurti/livev2/GeminiLiveSession.kt
          if grep -R -E 'onnx|Whisper|sceneview|PoliceVoiceEngine|SaudiHumanVoice' police-live-v2 --exclude='*.md'; then
            echo '::error::Legacy runtime dependency leaked into clean-room V2'
            exit 1
          fi
          echo 'V2_ISOLATION=PASS'

      - name: Build and lint only V2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :police-live-v2:testDebugUnitTest :police-live-v2:lintDebug :police-live-v2:assembleDebug

      - name: Inspect V2 APK
        run: |
          set -euo pipefail
          APK=$(ls police-live-v2/build/outputs/apk/debug/*.apk | head -1)
          test -s "$APK"
          echo "APK=$APK"
          du -h "$APK"
          python - "$APK" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              bad=[n for n in names if 'whisper' in n.lower() or n.lower().endswith('.onnx')]
              if bad:
                  raise SystemExit(f'legacy/offline payload leaked into V2 APK: {bad[:10]}')
              if not any(n.endswith('cinematic_office_reference.png') for n in names):
                  raise SystemExit('photoreal reference image missing')
          print('V2_APK_ISOLATION=PASS')
          PY

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: AlShorti-LIVE-V2-2.0.0-alpha1
          path: police-live-v2/build/outputs/apk/debug/*.apk
          retention-days: 30
