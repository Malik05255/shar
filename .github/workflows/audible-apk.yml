name: Al-Shorti Radical Recovery APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office

concurrency:
  group: alshorti-radical-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audible:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Load version
        run: cat version.properties >> "$GITHUB_ENV"

      - name: Require Gemini configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY missing'; exit 1; }

      - name: Prepare photoreal office master frame
        env:
          MASTER_FRAME_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png
        run: |
          set -euo pipefail
          DRAW_DIR="police-app/src/main/res/drawable-nodpi"
          mkdir -p "$DRAW_DIR"
          rm -f "$DRAW_DIR/cinematic_office_reference.jpg" "$DRAW_DIR/cinematic_office_reference.png"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 120 \
            "$MASTER_FRAME_URL" \
            --output "$DRAW_DIR/cinematic_office_reference.png"
          test -s "$DRAW_DIR/cinematic_office_reference.png"

      - name: Generate and validate emergency Saudi speech fallback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
        run: python3 tools/generate_bundled_natural_voice.py

      - name: Audit bundled speech files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, wave, audioop
          root = pathlib.Path('police-app/src/main')
          catalog = json.loads((root/'assets/natural_voice_catalog.json').read_text())
          assert len(catalog) == 15, f'expected 15 fallback phrases, found {len(catalog)}'
          raw = root/'res/raw'
          expected = {f"voice_{x['id']}.wav" for x in catalog}
          actual = {p.name for p in raw.glob('voice_*.wav')}
          assert actual == expected, (actual, expected)
          for name in sorted(expected):
              path = raw/name
              with wave.open(str(path), 'rb') as w:
                  assert w.getnchannels() == 1
                  assert w.getsampwidth() == 2
                  assert w.getframerate() >= 16000
                  frames = w.readframes(w.getnframes())
                  assert w.getnframes() > 1000
                  assert audioop.rms(frames, 2) > 150, f'{name}: effectively silent'
              assert path.stat().st_size > 3000
          print('BUNDLED_FALLBACK_GATE=PASS count=', len(expected))
          PY

      - name: Enforce radical architecture invariants
        run: |
          set -euo pipefail
          grep -q 'class HybridPoliceBrain' police-app/src/main/kotlin/com/malik/alshurti/PoliceBrain.kt
          grep -q 'gemini-3.5-flash-lite' police-app/src/main/kotlin/com/malik/alshurti/PoliceBrain.kt
          grep -q 'SpeechBackend.CLOUD' police-app/src/main/kotlin/com/malik/alshurti/PoliceVoiceEngine.kt
          grep -q 'localVoice.prepare(allowDownload = true)' police-app/src/main/kotlin/com/malik/alshurti/PoliceVoiceEngine.kt
          grep -q 'AMBIENT_COOLDOWN' police-app/src/main/kotlin/com/malik/alshurti/AiCinematicDogStage.kt
          if grep -q "printf '\[\]" .github/workflows/audible-apk.yml; then
            echo '::error::voice catalog must never be erased at build time'
            exit 1
          fi
          echo 'ARCHITECTURE_GATE=PASS'

      - name: Smoke live Gemini conversation, TTS and transcription
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
        run: python3 tools/smoke_online_stack.py

      - name: Build, test and lint recovery APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
          ALSHORTI_GEMINI_STAFF_VOICE: ${{ secrets.ALSHORTI_GEMINI_STAFF_VOICE }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :police-app:testDebugUnitTest :police-app:lintDebug :police-app:assembleDebug

      - name: Verify final APK recovery payload
        run: |
          set -euo pipefail
          APK=$(ls police-app/build/outputs/apk/debug/*.apk | head -1)
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import json, sys, zipfile
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              raw=[n for n in z.namelist() if n.startswith('res/raw/voice_') and n.endswith('.wav')]
              if len(raw) != 15:
                  raise SystemExit(f'expected 15 emergency voice resources, found {len(raw)}')
              catalog=json.loads(z.read('assets/natural_voice_catalog.json').decode('utf-8'))
              if len(catalog) != 15:
                  raise SystemExit(f'expected 15 runtime fallback phrases, found {len(catalog)}')
              print('APK_RECOVERY_PAYLOAD_GATE=PASS voice_resources=', len(raw), 'catalog=', len(catalog))
          PY

      - name: Upload radical recovery APK
        uses: actions/upload-artifact@v4
        with:
          name: AlShorti-${{ env.VERSION_NAME }}-radical-recovery
          path: police-app/build/outputs/apk/debug/*.apk
          retention-days: 30
