name: Generate Hunyuan 2.1 Second Shape Seed - Free ZeroGPU

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-hunyuan21-second-seed.yml'
      - 'runtime3d/hf_hunyuan21_shape_seed_candidate.py'

permissions:
  contents: read
  actions: read

jobs:
  second-seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HERO_REFERENCE_RUN_ID: '33391759260'
      HERO_REFERENCE_ARTIFACT: Runtime3D-photorealistic-hero-reference-candidate
      HERO_REFERENCE_FILE: police_dog.hero_reference.fullbody.png
      HERO_SEED: '7319'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enforce free shape-only gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('runtime3d/manifest.json').read_text())
          assert manifest.get('enabled') is False
          print('FREE_ONLY=true')
          print('SECOND_SHAPE_SEED=true')
          print('TEXTURE_GENERATION=false')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Download exact hero reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HERO_REFERENCE_ARTIFACT }}
          path: ${{ runner.temp }}/hero-reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HERO_REFERENCE_RUN_ID }}

      - name: Verify reference bytes
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE"
          test -s "$P"
          (( $(stat -c%s "$P") >= 10000 ))

      - name: Install free Gradio client
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2'

      - name: Generate deterministic second Hunyuan 2.1 shape
        id: generate
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/hunyuan21-seed"
          python3 runtime3d/hf_hunyuan21_shape_seed_candidate.py \
            --reference "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE" \
            --seed "$HERO_SEED" \
            --output-dir "$RUNNER_TEMP/hunyuan21-seed" \
            2>&1 | tee "$RUNNER_TEMP/hunyuan21-seed/run.log"
          exit ${PIPESTATUS[0]}

      - name: Show seed report
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/hunyuan21-seed/hunyuan21-second-seed-report.json"
          if [[ -f "$REPORT" ]]; then cat "$REPORT"; else echo 'No seed report generated'; fi

      - name: Upload second-seed candidate or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-hunyuan21-second-seed-candidate
          path: ${{ runner.temp }}/hunyuan21-seed/*
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed if free seed generation failed
        if: steps.generate.outcome != 'success'
        run: |
          echo '::error::Second free Hunyuan 2.1 shape seed was unavailable.'
          echo 'PAID_FALLBACK=false'
          echo 'PRODUCTION_GATE=CLOSED'
          exit 1

      - name: Keep production gate closed
        run: |
          echo 'MANUAL_VISUAL_COMPARISON_REQUIRED=true'
          echo 'PBR_NOT_STARTED=true'
          echo 'PRODUCTION_GATE=CLOSED'
