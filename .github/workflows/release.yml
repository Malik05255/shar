name: Publish Al-Shorti Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: alshorti-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - run: chmod +x gradlew

      - name: Load app version
        run: cat version.properties >> "$GITHUB_ENV"

      - name: Check signing and voice prerequisites
        id: prerequisites
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALSHORTI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$KEYSTORE_BASE64" ]] && missing+=("ALSHORTI_KEYSTORE_BASE64")
          [[ -z "$KEYSTORE_PASSWORD" ]] && missing+=("ALSHORTI_KEYSTORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && missing+=("ALSHORTI_KEY_ALIAS")
          [[ -z "$KEY_PASSWORD" ]] && missing+=("ALSHORTI_KEY_PASSWORD")
          [[ -z "$GEMINI_API_KEY" ]] && missing+=("GEMINI_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release skipped. Missing repository secrets: ${missing[*]}"
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/alshorti-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "ALSHORTI_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        if: steps.prerequisites.outputs.ready == 'true'
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare exact cinematic fallback frame
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DRAW_DIR="police-app/src/main/res/drawable-nodpi"
          mkdir -p "$DRAW_DIR"
          rm -f "$DRAW_DIR/cinematic_office_reference.jpg" "$DRAW_DIR/cinematic_office_reference.png"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 120 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png' \
            --output "$DRAW_DIR/cinematic_office_reference.png"
          test -s "$DRAW_DIR/cinematic_office_reference.png"
          echo "Release bundles zero cinematic MP4 files."

      - name: Verify exact cinematic CDN assets
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142010_21ee919f-e378-4db1-b7ed-66e367acc0e3.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142018_248ecb5a-3804-457a-9a43-9b19de5f8121.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_141957_53df74a5-4bcb-445d-95a5-69182cd4f0d5.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142642_29bd6e49-40ad-484b-97f2-ebed9197a923.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142734_345318c2-5f9c-4f87-b067-8ca5bb5c5b54.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_140952_4319b02c-dc65-4750-b24f-f5459350058b.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142029_d4e858db-fdfa-46ce-a248-34ccf47f19de.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_145806_3f9ed13a-6db3-41a4-a89a-34a383d9f5a3.mp4'
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/d332e06e-e71d-4a6f-bd09-25701099796e.mp4'
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/d974bddb-4396-45bb-b829-2bdc0c87aa12.mp4'
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/5f6f1b84-9230-4dc9-ad56-e87a3f18ded6.mp4'
          )
          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --location --head --connect-timeout 15 --max-time 30 "$url" >/dev/null
          done

      - name: Verify Gemini Saudi-directed voice end-to-end
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
        run: |
          set -euo pipefail
          VOICE="${ALSHORTI_GEMINI_POLICE_VOICE:-Gacrux}"
          RESPONSE="$RUNNER_TEMP/gemini-release-response.json"
          WAV="$RUNNER_TEMP/gemini-release.wav"
          PAYLOAD=$(python3 - <<PY
          import json
          print(json.dumps({
            "model":"gemini-3.1-flash-tts-preview",
            "input":"Generate speech audio only. Native Saudi man from Riyadh, natural conversational Najdi/Saudi accent. [TRANSCRIPT] هلا يا بطل، معك الشرطي. وش عندك؟",
            "response_format":{"type":"audio"},
            "generation_config":{"speech_config":[{"voice":"${VOICE}"}]}
          }, ensure_ascii=False))
          PY
          )
          HTTP_CODE=$(curl --silent --show-error --location --output "$RESPONSE" --write-out '%{http_code}' --connect-timeout 15 --max-time 60 \
            -X POST 'https://generativelanguage.googleapis.com/v1beta/interactions' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" -H 'Content-Type: application/json' -H 'Api-Revision: 2026-05-20' --data "$PAYLOAD")
          [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]
          python3 - <<PY
          import base64,json,wave
          data=json.load(open("$RESPONSE")); audio=None
          for step in data.get("steps",[]):
              if step.get("type")=="model_output":
                  for block in step.get("content",[]):
                      if block.get("type")=="audio" and block.get("data"):
                          audio=block; break
              if audio: break
          if not audio: raise SystemExit("No Gemini audio")
          raw=base64.b64decode(audio["data"])
          rate=int(audio.get("sample_rate") or audio.get("sampleRate") or 24000)
          with wave.open("$WAV","wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(raw)
          with wave.open("$WAV","rb") as w:
              assert w.getnframes()>1000 and w.getframerate()>=16000
          PY
          rm -f "$RESPONSE" "$WAV"

      - name: Build signed release APK
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        env:
          ALSHORTI_KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          ALSHORTI_KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          ALSHORTI_KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
          ALSHORTI_GEMINI_STAFF_VOICE: ${{ secrets.ALSHORTI_GEMINI_STAFF_VOICE }}
        run: ./gradlew --no-daemon :police-app:assembleRelease

      - name: Verify and prepare release files
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK='police-app/build/outputs/apk/release/police-app-release.apk'
          test -s "$SOURCE_APK"
          mkdir -p release-out
          RELEASE_APK="release-out/AlShorti-${VERSION_NAME}.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${RELEASE_APK}.sha256" >> "$GITHUB_ENV"
          du -h "$RELEASE_APK"

      - name: Publish GitHub Release
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION_NAME}"
          gh release create "$TAG" "$RELEASE_APK" "$RELEASE_SHA" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "الشرطي ${VERSION_NAME}" --generate-notes --latest

      - name: Upload signed APK artifact
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AlShorti-${{ env.VERSION_NAME }}-signed-release
          path: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_SHA }}
