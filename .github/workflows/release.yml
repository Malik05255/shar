name: Publish Al-Shorti Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: alshorti-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Load app version
        run: cat version.properties >> "$GITHUB_ENV"

      - name: Check signing and natural voice prerequisites
        id: prerequisites
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALSHORTI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -z "$KEYSTORE_BASE64" ]] && missing+=("ALSHORTI_KEYSTORE_BASE64")
          [[ -z "$KEYSTORE_PASSWORD" ]] && missing+=("ALSHORTI_KEYSTORE_PASSWORD")
          [[ -z "$KEY_ALIAS" ]] && missing+=("ALSHORTI_KEY_ALIAS")
          [[ -z "$KEY_PASSWORD" ]] && missing+=("ALSHORTI_KEY_PASSWORD")
          [[ -z "$GEMINI_API_KEY" ]] && missing+=("GEMINI_API_KEY")

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release skipped. Missing repository secrets: ${missing[*]}"
            exit 0
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/alshorti-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "ALSHORTI_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        if: steps.prerequisites.outputs.ready == 'true'
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare cinematic dog motion assets
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        shell: bash
        env:
          MASTER_FRAME_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png
          DOG_IDLE_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142010_21ee919f-e378-4db1-b7ed-66e367acc0e3.mp4
          DOG_TALK_SEATED_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142018_248ecb5a-3804-457a-9a43-9b19de5f8121.mp4
          DOG_STAND_UP_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_141957_53df74a5-4bcb-445d-95a5-69182cd4f0d5.mp4
          DOG_TALK_STANDING_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142642_29bd6e49-40ad-484b-97f2-ebed9197a923.mp4
          DOG_APPROACH_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142734_345318c2-5f9c-4f87-b067-8ca5bb5c5b54.mp4
          DOG_PHONE_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_140952_4319b02c-dc65-4750-b24f-f5459350058b.mp4
          DOG_DOOR_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142029_d4e858db-fdfa-46ce-a248-34ccf47f19de.mp4
          DOG_REVIEW_FILE_URL: https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_145806_3f9ed13a-6db3-41a4-a89a-34a383d9f5a3.mp4
        run: |
          set -euo pipefail
          RAW_DIR="police-app/src/main/res/raw"
          DRAW_DIR="police-app/src/main/res/drawable-nodpi"
          mkdir -p "$RAW_DIR" "$DRAW_DIR"

          fetch_asset() {
            local url="$1"
            local out="$2"
            echo "Downloading $(basename "$out")"
            curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 20 \
              --max-time 180 "$url" --output "$out"
            test -s "$out"
          }

          rm -f "$DRAW_DIR/cinematic_office_reference.jpg" "$DRAW_DIR/cinematic_office_reference.png"
          rm -f "$RAW_DIR/dog_idle_living.mp4" "$RAW_DIR/dog_talk_seated_living.mp4" "$RAW_DIR/dog_talk_standing_living.mp4"
          fetch_asset "$MASTER_FRAME_URL" "$DRAW_DIR/cinematic_office_reference.png"
          fetch_asset "$DOG_IDLE_URL" "$RAW_DIR/dog_idle_loop.mp4"
          fetch_asset "$DOG_TALK_SEATED_URL" "$RAW_DIR/dog_talk_seated.mp4"
          fetch_asset "$DOG_STAND_UP_URL" "$RAW_DIR/dog_stand_up.mp4"
          fetch_asset "$DOG_TALK_STANDING_URL" "$RAW_DIR/dog_talk_standing.mp4"
          fetch_asset "$DOG_APPROACH_URL" "$RAW_DIR/dog_approach_camera.mp4"
          fetch_asset "$DOG_PHONE_URL" "$RAW_DIR/dog_answer_phone.mp4"
          fetch_asset "$DOG_DOOR_URL" "$RAW_DIR/dog_walk_to_door.mp4"
          fetch_asset "$DOG_REVIEW_FILE_URL" "$RAW_DIR/dog_review_file.mp4"

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi

          ffmpeg -hide_banner -loglevel error -y -i "$RAW_DIR/dog_stand_up.mp4" \
            -an -vf reverse -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -movflags +faststart "$RAW_DIR/dog_sit_down.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$RAW_DIR/dog_walk_to_door.mp4" \
            -an -vf reverse -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -movflags +faststart "$RAW_DIR/dog_return_to_desk.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$RAW_DIR/dog_approach_camera.mp4" \
            -an -vf reverse -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -movflags +faststart "$RAW_DIR/dog_return_from_camera.mp4"

      - name: Verify Gemini Saudi-directed voice end-to-end
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
        run: |
          set -euo pipefail
          VOICE="${ALSHORTI_GEMINI_POLICE_VOICE:-Gacrux}"
          RESPONSE="$RUNNER_TEMP/gemini-release-response.json"
          WAV="$RUNNER_TEMP/alshorti-gemini-release-smoke.wav"
          PAYLOAD=$(python3 - <<PY
          import json
          voice = "${VOICE}"
          prompt = """Generate speech audio only. Do not speak these directions. Voice direction: Native Saudi man from Riyadh, natural conversational Najdi/Saudi accent, mature calm presence, warm with children, not a broadcaster. Speak exactly the transcript after [TRANSCRIPT].\n[TRANSCRIPT]\nهلا يا بطل، معك الشرطي. وش عندك؟"""
          print(json.dumps({
            "model": "gemini-3.1-flash-tts-preview",
            "input": prompt,
            "response_format": {"type": "audio"},
            "generation_config": {"speech_config": [{"voice": voice}]}
          }, ensure_ascii=False))
          PY
          )
          HTTP_CODE=$(curl --silent --show-error --location \
            --output "$RESPONSE" --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 60 \
            -X POST "https://generativelanguage.googleapis.com/v1beta/interactions" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD")
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::Gemini TTS smoke test failed with HTTP ${HTTP_CODE}."
            exit 1
          fi
          python3 - <<PY
          import base64, json, wave
          data=json.load(open("$RESPONSE"))
          audio=data.get("output_audio") or data.get("outputAudio") or {}
          encoded=audio.get("data","")
          if not encoded:
              raise SystemExit("Gemini response did not include output_audio.data")
          pcm=base64.b64decode(encoded)
          if len(pcm) < 3000:
              raise SystemExit("Gemini returned an unexpectedly short audio buffer")
          with wave.open("$WAV","wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(24000); w.writeframes(pcm)
          PY
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 "$WAV"
          rm -f "$RESPONSE" "$WAV"

      - name: Build signed release APK
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        env:
          ALSHORTI_KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          ALSHORTI_KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          ALSHORTI_KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
          ALSHORTI_GEMINI_STAFF_VOICE: ${{ secrets.ALSHORTI_GEMINI_STAFF_VOICE }}
        run: ./gradlew --no-daemon :police-app:assembleRelease

      - name: Verify and prepare release files
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="police-app/build/outputs/apk/release/police-app-release.apk"
          test -s "$SOURCE_APK"

          mkdir -p release-out
          RELEASE_APK="release-out/AlShorti-${VERSION_NAME}.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"

          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${RELEASE_APK}.sha256" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}"
          gh release create "$TAG" "$RELEASE_APK" "$RELEASE_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "الشرطي ${VERSION_NAME}" \
            --generate-notes \
            --latest

      - name: Upload signed APK artifact
        if: steps.prerequisites.outputs.ready == 'true' && steps.release_check.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AlShorti-${{ env.VERSION_NAME }}-signed-release
          path: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_SHA }}
