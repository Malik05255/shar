name: Rig Runtime 3D Hero Candidate - Blender Free

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-autorig.yml'
      - 'runtime3d/blender_autorig_candidate.py'
      - 'runtime3d/.autorig-run-once'

permissions:
  contents: read
  actions: read

jobs:
  blender-autorig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: '33392568974'
      SOURCE_ARTIFACT: Runtime3D-free-provider-pool-candidate
      SOURCE_GLB: police_dog.hf-hunyuan3d-2.1-zero.candidate.glb

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Enforce quality policy
        shell: bash
        run: |
          set -euo pipefail
          echo 'FREE_ONLY=true'
          echo 'DECIMATION=false'
          echo 'REMESH=false'
          echo 'LOW_POLY_FALLBACK=false'
          echo 'PRODUCTION_ACTIVATION=false'

      - name: Download exact Hunyuan candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ runner.temp }}/hunyuan-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify source GLB
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/hunyuan-source/$SOURCE_GLB"
          test -s "$SRC"
          BYTES=$(stat -c%s "$SRC")
          if (( BYTES < 1000000 )); then
            echo "::error::Source GLB unexpectedly small: $BYTES"
            exit 1
          fi
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'runtime3d')
          from inspect_glb import read_glb_json
          p = Path(os.environ['RUNNER_TEMP']) / 'hunyuan-source' / os.environ['SOURCE_GLB']
          d = read_glb_json(p)
          meshes = d.get('meshes') or []
          accessors = d.get('accessors') or []
          vertices = 0
          for m in meshes:
              for prim in m.get('primitives') or []:
                  pos = (prim.get('attributes') or {}).get('POSITION')
                  if isinstance(pos, int) and 0 <= pos < len(accessors):
                      vertices += int(accessors[pos].get('count') or 0)
          print(f'source_bytes={p.stat().st_size}')
          print(f'source_meshes={len(meshes)}')
          print(f'source_vertices={vertices}')
          if not meshes or vertices < 200000:
              raise SystemExit('Source geometry floor failed')
          PY

      - name: Install Blender and glTF Python dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy
          blender --version | head -n 2
          blender --background --python-expr "import numpy; print('BLENDER_NUMPY=' + numpy.__version__)"

      - name: Run Blender automatic bone-heat rigging
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime3d-autorig"
          blender --background \
            --python runtime3d/blender_autorig_candidate.py -- \
            --input "$RUNNER_TEMP/hunyuan-source/$SOURCE_GLB" \
            --output "$RUNNER_TEMP/runtime3d-autorig/police_dog.blender_autorig.candidate.glb" \
            --qc "$RUNNER_TEMP/runtime3d-autorig/police_dog.blender_autorig.qc.json"

      - name: Validate exported rig structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'runtime3d')
          from inspect_glb import read_glb_json
          out = Path(os.environ['RUNNER_TEMP']) / 'runtime3d-autorig' / 'police_dog.blender_autorig.candidate.glb'
          qc_path = Path(os.environ['RUNNER_TEMP']) / 'runtime3d-autorig' / 'police_dog.blender_autorig.qc.json'
          if not out.is_file() or not qc_path.is_file():
              raise SystemExit('Rig output/QC missing')
          qc = json.loads(qc_path.read_text())
          d = read_glb_json(out)
          skins = d.get('skins') or []
          meshes = d.get('meshes') or []
          accessors = d.get('accessors') or []
          vertices = 0
          for m in meshes:
              for prim in m.get('primitives') or []:
                  pos = (prim.get('attributes') or {}).get('POSITION')
                  if isinstance(pos, int) and 0 <= pos < len(accessors):
                      vertices += int(accessors[pos].get('count') or 0)
          max_joints = max((len(s.get('joints') or []) for s in skins), default=0)
          print(json.dumps({
              'bytes': out.stat().st_size,
              'meshes': len(meshes),
              'vertices': vertices,
              'skins': len(skins),
              'maxJoints': max_joints,
              'qcBones': qc.get('bones'),
              'qcDeformBones': qc.get('deformBones'),
              'maxInfluences': qc.get('maxInfluencesPerVertex'),
              'unweightedRatio': qc.get('unweightedRatio'),
              'decimationApplied': qc.get('decimationApplied'),
          }, indent=2))
          if len(skins) < 1:
              raise SystemExit('No exported skin')
          if max_joints < 24:
              raise SystemExit(f'Joint floor failed: {max_joints}')
          if vertices < 200000:
              raise SystemExit(f'Geometry was reduced unexpectedly: {vertices}')
          if qc.get('decimationApplied') is not False:
              raise SystemExit('Decimation policy violated')
          if int(qc.get('maxInfluencesPerVertex', 99)) > 4:
              raise SystemExit('Influence limit violated')
          if float(qc.get('unweightedRatio', 1.0)) > 0.005:
              raise SystemExit('Unweighted vertex ratio failed')
          print('RIG_STRUCTURAL_GATE=PASS')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Confirm strict production animation gate remains closed
        shell: bash
        run: |
          set +e
          cp "$RUNNER_TEMP/runtime3d-autorig/police_dog.blender_autorig.candidate.glb" "$RUNNER_TEMP/runtime3d-autorig/police_dog.glb"
          python3 runtime3d/inspect_glb.py "$RUNNER_TEMP/runtime3d-autorig/police_dog.glb"
          RC=$?
          if [[ $RC -eq 0 ]]; then
            echo '::error::Strict production inspector unexpectedly passed before authored clip set.'
            exit 1
          fi
          echo 'Expected: strict production gate is still closed pending exact animation/facial clips.'
          exit 0

      - name: Upload rigged candidate and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-police-dog-blender-autorig-candidate
          path: ${{ runner.temp }}/runtime3d-autorig/*
          if-no-files-found: warn
          retention-days: 14
