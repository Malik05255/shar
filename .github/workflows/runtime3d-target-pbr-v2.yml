name: Validate Target-Owned Hero PBR V2

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-target-pbr-v2.yml'
      - 'runtime3d/blender_author_target_pbr.py'
      - 'runtime3d/blender_author_target_pbr_v2.py'
      - 'runtime3d/inspect_glb.py'

permissions:
  contents: read
  actions: read

jobs:
  target-pbr-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MOTION_RUN_ID: '33427570106'
      MOTION_ARTIFACT: Runtime3D-police-dog-motion-v2-candidate
      MOTION_GLB: police_dog.motion_v2_candidate.glb
      DONOR_RUN_ID: '33410396487'
      DONOR_ARTIFACT: Runtime3D-sf3d-textured-reference-candidate
      DONOR_GLB: police_dog.sf3d.textured_reference.glb
      OUTPUT_GLB: police_dog.motion_v2_target_pbr_v2_candidate.glb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce candidate-only free policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('runtime3d/manifest.json').read_text())
          assert manifest.get('enabled') is False
          assert manifest.get('actors') == []
          print('FREE_ONLY=true')
          print('PAID_FALLBACK=false')
          print('TARGET_OWNED_PBR=true')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Download exact Motion V2 source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOTION_ARTIFACT }}
          path: ${{ runner.temp }}/motion
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MOTION_RUN_ID }}

      - name: Download free visual reference donor
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DONOR_ARTIFACT }}
          path: ${{ runner.temp }}/donor
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.DONOR_RUN_ID }}

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy libegl1 libgl1-mesa-dri
          blender --version | head -n 2

      - name: Author seven target-owned PBR regions
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: 'surfaceless'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target-pbr-v2/previews"
          blender --background \
            --python runtime3d/blender_author_target_pbr_v2.py -- \
            --target "$RUNNER_TEMP/motion/$MOTION_GLB" \
            --donor "$RUNNER_TEMP/donor/$DONOR_GLB" \
            --output "$RUNNER_TEMP/target-pbr-v2/$OUTPUT_GLB" \
            --qc "$RUNNER_TEMP/target-pbr-v2/target-pbr-v2.qc.json" \
            --preview-dir "$RUNNER_TEMP/target-pbr-v2/previews"
          test -s "$RUNNER_TEMP/target-pbr-v2/$OUTPUT_GLB"
          test -s "$RUNNER_TEMP/target-pbr-v2/target-pbr-v2.qc.json"
          test "$(find "$RUNNER_TEMP/target-pbr-v2/previews" -type f -name '*.png' | wc -l)" -eq 3

      - name: Validate structural visual contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'runtime3d')
          from inspect_glb import read_glb_json, DOG_CLIPS
          root=Path(os.environ['RUNNER_TEMP'])/'target-pbr-v2'
          p=root/os.environ['OUTPUT_GLB']
          d=read_glb_json(p)
          names={a.get('name') for a in (d.get('animations') or []) if a.get('name')}
          missing=sorted(set(DOG_CLIPS)-names); extra=sorted(names-set(DOG_CLIPS))
          skins=d.get('skins') or []; joints=max((len(s.get('joints') or []) for s in skins),default=0)
          mats=d.get('materials') or []; tex=d.get('textures') or []; imgs=d.get('images') or []
          base=normal=0; metallic=[]; rough=[]
          for mat in mats:
              pbr=mat.get('pbrMetallicRoughness') or {}
              base += int(isinstance((pbr.get('baseColorTexture') or {}).get('index'),int))
              normal += int(isinstance((mat.get('normalTexture') or {}).get('index'),int))
              metallic.append(float(pbr.get('metallicFactor',1.0)))
              rough.append(float(pbr.get('roughnessFactor',1.0)))
          accessors=d.get('accessors') or []; vertices=0
          material_indices=set()
          for mesh in d.get('meshes') or []:
              for prim in mesh.get('primitives') or []:
                  attrs=prim.get('attributes') or {}; pos=attrs.get('POSITION')
                  if isinstance(pos,int) and 0 <= pos < len(accessors): vertices += int(accessors[pos].get('count') or 0)
                  if isinstance(prim.get('material'),int): material_indices.add(int(prim['material']))
          qc=json.loads((root/'target-pbr-v2.qc.json').read_text())
          vb=qc.get('targetVerticesBeforeAfter') or []; pb=qc.get('targetPolygonsBeforeAfter') or []
          summary={'bytes':p.stat().st_size,'vertices':vertices,'animations':len(names),'missing':missing,'extra':extra,
                   'skins':len(skins),'joints':joints,'materials':len(mats),'textures':len(tex),'images':len(imgs),
                   'baseMaterials':base,'normalMaterials':normal,'primitiveMaterials':sorted(material_indices),
                   'metallic':metallic,'roughness':rough,'verticesBeforeAfter':vb,'polygonsBeforeAfter':pb}
          print(json.dumps(summary,indent=2))
          if missing or extra or len(names)!=26: raise SystemExit('Exact 26 animation contract failed')
          if len(skins)!=1 or joints < 32: raise SystemExit('Skin/joint contract failed')
          if vertices < 1_000_000: raise SystemExit('Full-detail geometry floor failed')
          if len(vb)!=2 or vb[0]!=vb[1] or len(pb)!=2 or pb[0]!=pb[1]: raise SystemExit('Topology changed')
          if len(mats)<7 or base<7 or normal<7 or len(tex)<14 or len(imgs)<14: raise SystemExit('Seven PBR regions not embedded')
          if len(material_indices)<7: raise SystemExit('Seven PBR regions not referenced by mesh primitives')
          if any(abs(v)>1e-6 for v in metallic): raise SystemExit('Unexpected metallic surface')
          print('TARGET_PBR_V2_GATE=PASS')
          PY

      - name: Upload candidate and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-police-dog-motion-v2-target-pbr-v2-candidate
          path: ${{ runner.temp }}/target-pbr-v2/*
          if-no-files-found: warn
          retention-days: 14

      - name: Keep production closed
        if: success()
        run: |
          echo 'MANUAL_VISUAL_QC_REQUIRED=true'
          echo 'SPARSE_MOTION_TRANSPLANT_REQUIRED=true'
          echo 'PHYSICAL_ANDROID_GATE_REQUIRED=true'
          echo 'PRODUCTION_GATE=CLOSED'
