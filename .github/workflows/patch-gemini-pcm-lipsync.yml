name: Patch Gemini PCM Lip Sync

on:
  push:
    paths:
      - runtime3d/.gemini_pcm_lipsync_trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch natural voice timing and PCM energy
        run: python3 tools/patch_gemini_pcm_lipsync.py
      - name: Commit PCM lip sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add police-app/src/main/kotlin/com/malik/alshurti/voice/SaudiHumanVoice.kt police-app/src/main/kotlin/com/malik/alshurti/PoliceVoiceEngine.kt
          git diff --cached --check
          git commit -m "Drive Gemini lip sync from real PCM energy"
          git push origin HEAD:${{ github.ref_name }}
