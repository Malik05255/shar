name: Generate Hunyuan 2.0 Textured Comparison - Free ZeroGPU

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-hunyuan20-textured.yml'
      - 'runtime3d/hf_hunyuan20_textured_candidate.py'

permissions:
  contents: read
  actions: read

jobs:
  textured-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HERO_REFERENCE_RUN_ID: '33391759260'
      HERO_REFERENCE_ARTIFACT: Runtime3D-photorealistic-hero-reference-candidate
      HERO_REFERENCE_FILE: police_dog.hero_reference.fullbody.png
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enforce free comparison-only gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('runtime3d/manifest.json').read_text())
          assert manifest.get('enabled') is False
          print('FREE_ONLY=true')
          print('PAID_FALLBACK=false')
          print('TEXTURED_COMPARISON_ONLY=true')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Download exact hero reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HERO_REFERENCE_ARTIFACT }}
          path: ${{ runner.temp }}/hero-reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HERO_REFERENCE_RUN_ID }}

      - name: Verify exact hero reference
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE"
          BYTES=$(stat -c%s "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE")
          (( BYTES >= 10000 ))
          echo "heroReferenceBytes=$BYTES"

      - name: Install free Gradio client
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2'

      - name: Generate official Hunyuan 2.0 textured comparison
        id: generate
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/hunyuan20-textured"
          python3 runtime3d/hf_hunyuan20_textured_candidate.py \
            --reference "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE" \
            --output-dir "$RUNNER_TEMP/hunyuan20-textured" \
            2>&1 | tee "$RUNNER_TEMP/hunyuan20-textured/run.log"
          exit ${PIPESTATUS[0]}

      - name: Show free-only report
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/hunyuan20-textured/hunyuan20-textured-report.json"
          if [[ -f "$REPORT" ]]; then cat "$REPORT"; else echo 'No report generated'; fi

      - name: Upload comparison or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-hunyuan20-textured-comparison
          path: ${{ runner.temp }}/hunyuan20-textured/*
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed if free textured generation failed
        if: steps.generate.outcome != 'success'
        run: |
          echo '::error::Free Hunyuan 2.0 textured comparison did not produce an accepted GLB.'
          echo 'PAID_FALLBACK=false'
          echo 'PRODUCTION_GATE=CLOSED'
          exit 1

      - name: Keep production gate closed
        run: |
          echo 'MANUAL_VISUAL_QC_REQUIRED=true'
          echo 'HUNYUAN21_PBR_EQUIVALENCE=false'
          echo 'RIGGING_NOT_AUTHORIZED_BY_STRUCTURAL_PASS=true'
          echo 'PRODUCTION_GATE=CLOSED'
