name: Build Hunyuan Turbo PBR Animated Hero - Free

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-hunyuan-turbo-pbr.yml'
      - 'runtime3d/hf_gradio_direct_hunyuan_turbo.py'
      - 'runtime3d/blender_transfer_pbr_candidate.py'
      - 'runtime3d/inspect_glb.py'

permissions:
  contents: read
  actions: read

jobs:
  hunyuan-pbr-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HERO_REFERENCE_RUN_ID: '33391759260'
      HERO_REFERENCE_ARTIFACT: Runtime3D-photorealistic-hero-reference-candidate
      HERO_REFERENCE_FILE: police_dog.hero_reference.fullbody.png
      MOTION_RUN_ID: '33393807309'
      MOTION_ARTIFACT: Runtime3D-police-dog-motion-candidate
      MOTION_GLB: police_dog.motion_candidate.glb

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enforce free-only quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('runtime3d/manifest.json').read_text())
          assert manifest.get('enabled') is False
          print('FREE_ONLY=true')
          print('PAID_FALLBACK=false')
          print('DECIMATION=false')
          print('REMESH=false')
          print('PRESERVE_SKIN=true')
          print('PRESERVE_REQUIRED_CLIPS=true')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Require legitimate Hugging Face free token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_TOKEN:-}" ]]; then
            echo '::error::HF_TOKEN is not configured. This workflow refuses any paid fallback.'
            exit 1
          fi

      - name: Download exact approved hero reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HERO_REFERENCE_ARTIFACT }}
          path: ${{ runner.temp }}/hero-reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HERO_REFERENCE_RUN_ID }}

      - name: Download exact 26-clip animated hero
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOTION_ARTIFACT }}
          path: ${{ runner.temp }}/motion
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.MOTION_RUN_ID }}

      - name: Verify immutable source inputs
        shell: bash
        run: |
          set -euo pipefail
          REF="$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE"
          MOTION="$RUNNER_TEMP/motion/$MOTION_GLB"
          test -s "$REF"
          test -s "$MOTION"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'runtime3d')
          from inspect_glb import read_glb_json, DOG_CLIPS
          motion = Path(os.environ['RUNNER_TEMP'])/'motion'/os.environ['MOTION_GLB']
          d = read_glb_json(motion)
          names = {a.get('name') for a in (d.get('animations') or []) if a.get('name')}
          skins = d.get('skins') or []
          joints = max((len(s.get('joints') or []) for s in skins), default=0)
          missing = sorted(set(DOG_CLIPS) - names)
          print(json.dumps({'motionBytes': motion.stat().st_size, 'animations': len(names), 'missing': missing,
                            'skins': len(skins), 'maxJoints': joints}, indent=2))
          if missing or not skins or joints < 24:
              raise SystemExit('Animated source contract failed')
          PY

      - name: Install direct free-provider client
        shell: bash
        run: python3 -m pip install --quiet 'requests>=2.31,<3'

      - name: Generate textured Hunyuan Turbo donor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hunyuan-turbo"
          python3 runtime3d/hf_gradio_direct_hunyuan_turbo.py \
            --reference "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE" \
            --output "$RUNNER_TEMP/hunyuan-turbo/police_dog.hunyuan_turbo.textured_donor.glb" \
            --report "$RUNNER_TEMP/hunyuan-turbo/police_dog.hunyuan_turbo.textured_donor.json"
          test -s "$RUNNER_TEMP/hunyuan-turbo/police_dog.hunyuan_turbo.textured_donor.glb"
          test -s "$RUNNER_TEMP/hunyuan-turbo/police_dog.hunyuan_turbo.textured_donor.json"

      - name: Verify donor really contains PBR payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'runtime3d')
          from inspect_glb import read_glb_json
          p = Path(os.environ['RUNNER_TEMP'])/'hunyuan-turbo'/'police_dog.hunyuan_turbo.textured_donor.glb'
          d = read_glb_json(p)
          mats = d.get('materials') or []
          tex = d.get('textures') or []
          imgs = d.get('images') or []
          accessors = d.get('accessors') or []
          vertices = 0
          for mesh in d.get('meshes') or []:
              for prim in mesh.get('primitives') or []:
                  pos = (prim.get('attributes') or {}).get('POSITION')
                  if isinstance(pos, int) and 0 <= pos < len(accessors):
                      vertices += int(accessors[pos].get('count') or 0)
          has_base = any(isinstance(((m.get('pbrMetallicRoughness') or {}).get('baseColorTexture') or {}).get('index'), int) for m in mats)
          has_normal = any(isinstance((m.get('normalTexture') or {}).get('index'), int) for m in mats)
          print(json.dumps({'bytes': p.stat().st_size, 'vertices': vertices, 'materials': len(mats),
                            'textures': len(tex), 'images': len(imgs), 'baseColorTexture': has_base,
                            'normalTexture': has_normal}, indent=2))
          if vertices < 100000 or not mats or not tex or not imgs or not has_base:
              raise SystemExit('Hunyuan textured donor failed PBR structural gate')
          PY

      - name: Install free Blender runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            blender python3-numpy libegl1 libgl1-mesa-dri
          blender --version | head -n 2
          ldconfig -p | grep -E 'libEGL\.so\.1|libGL\.so\.1'

      - name: Transfer Hunyuan PBR onto exact animated topology
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: 'surfaceless'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hunyuan-pbr-motion/previews"
          blender --background \
            --python runtime3d/blender_transfer_pbr_candidate.py -- \
            --target "$RUNNER_TEMP/motion/$MOTION_GLB" \
            --donor "$RUNNER_TEMP/hunyuan-turbo/police_dog.hunyuan_turbo.textured_donor.glb" \
            --output "$RUNNER_TEMP/hunyuan-pbr-motion/police_dog.hunyuan_pbr_motion_candidate.glb" \
            --qc "$RUNNER_TEMP/hunyuan-pbr-motion/police_dog.hunyuan_pbr_motion_candidate.qc.json" \
            --preview-dir "$RUNNER_TEMP/hunyuan-pbr-motion/previews"
          test -s "$RUNNER_TEMP/hunyuan-pbr-motion/police_dog.hunyuan_pbr_motion_candidate.glb"
          test -s "$RUNNER_TEMP/hunyuan-pbr-motion/police_dog.hunyuan_pbr_motion_candidate.qc.json"

      - name: Run strict animated GLB structural gate
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/hunyuan-pbr-motion/police_dog.hunyuan_pbr_motion_candidate.glb" \
             "$RUNNER_TEMP/hunyuan-pbr-motion/police_dog.glb"
          python3 runtime3d/inspect_glb.py "$RUNNER_TEMP/hunyuan-pbr-motion/police_dog.glb"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'runtime3d')
          from inspect_glb import read_glb_json, DOG_CLIPS
          root = Path(os.environ['RUNNER_TEMP'])/'hunyuan-pbr-motion'
          p = root/'police_dog.hunyuan_pbr_motion_candidate.glb'
          qc = json.loads((root/'police_dog.hunyuan_pbr_motion_candidate.qc.json').read_text())
          d = read_glb_json(p)
          names = {a.get('name') for a in (d.get('animations') or []) if a.get('name')}
          missing = sorted(set(DOG_CLIPS) - names)
          skins = d.get('skins') or []
          joints = max((len(s.get('joints') or []) for s in skins), default=0)
          mats = d.get('materials') or []
          tex = d.get('textures') or []
          imgs = d.get('images') or []
          before = qc.get('topologyBefore') or qc.get('targetTopologyBefore') or qc.get('targetVerticesBeforeAfter')
          after = qc.get('topologyAfter') or qc.get('targetTopologyAfter') or qc.get('targetPolygonsBeforeAfter')
          print(json.dumps({'bytes': p.stat().st_size, 'animations': len(names), 'missing': missing,
                            'skins': len(skins), 'maxJoints': joints, 'materials': len(mats),
                            'textures': len(tex), 'images': len(imgs), 'qcTopologyBefore': before,
                            'qcTopologyAfter': after, 'previewFiles': qc.get('previewFiles')}, indent=2))
          if missing or not skins or joints < 24 or not mats or not tex or not imgs:
              raise SystemExit('Final animated PBR structural contract failed')
          print('HUNYUAN_PBR_ANIMATED_STRUCTURAL_GATE=PASS')
          print('MANUAL_VISUAL_IDENTITY_GATE_REQUIRED=true')
          print('FACIAL_DEFORMATION_GATE_REQUIRED=true')
          print('PHYSICAL_ANDROID_GATE_REQUIRED=true')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Upload Hunyuan donor, animated PBR candidate and QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-police-dog-hunyuan-pbr-motion-candidate
          path: |
            ${{ runner.temp }}/hunyuan-turbo/*
            ${{ runner.temp }}/hunyuan-pbr-motion/*
          if-no-files-found: warn
          retention-days: 14

      - name: Keep production manifest closed
        if: always()
        run: |
          echo 'No production activation is performed by this workflow.'
          echo 'PRODUCTION_GATE=CLOSED'
