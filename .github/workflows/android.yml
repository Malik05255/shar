name: Android CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Resolve app module
        run: |
          if [ -d police-app ]; then
            echo "APP_MODULE=police-app" >> "$GITHUB_ENV"
          else
            echo "APP_MODULE=app" >> "$GITHUB_ENV"
          fi
      - name: Build Debug APK
        run: ./gradlew --no-daemon :${APP_MODULE}:assembleDebug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlShorti-debug-apk
          path: ${{ env.APP_MODULE }}/build/outputs/apk/debug/*.apk

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Resolve app module
        run: |
          if [ -d police-app ]; then
            echo "APP_MODULE=police-app" >> "$GITHUB_ENV"
          else
            echo "APP_MODULE=app" >> "$GITHUB_ENV"
          fi
      - name: Run Unit Tests
        run: ./gradlew --no-daemon :${APP_MODULE}:testDebugUnitTest

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Resolve app module
        run: |
          if [ -d police-app ]; then
            echo "APP_MODULE=police-app" >> "$GITHUB_ENV"
          else
            echo "APP_MODULE=app" >> "$GITHUB_ENV"
          fi
      - name: Run Android Lint
        run: ./gradlew --no-daemon :${APP_MODULE}:lintDebug
