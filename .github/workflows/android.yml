name: Al-Shorti Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: alshorti-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Load app version
        run: cat version.properties >> "$GITHUB_ENV"

      - name: Restore permanent signing key when configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALSHORTI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Permanent signing not configured; using Android debug certificate."
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/alshorti-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "ALSHORTI_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Prepare exact cinematic fallback frame
        shell: bash
        env:
          MASTER_FRAME_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png
        run: |
          set -euo pipefail
          DRAW_DIR="police-app/src/main/res/drawable-nodpi"
          mkdir -p "$DRAW_DIR"
          rm -f "$DRAW_DIR/cinematic_office_reference.jpg" "$DRAW_DIR/cinematic_office_reference.png"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 120 \
            "$MASTER_FRAME_URL" --output "$DRAW_DIR/cinematic_office_reference.png"
          test -s "$DRAW_DIR/cinematic_office_reference.png"
          echo "Photoreal frame prepared beneath non-repeating cinematic motion."

      - name: Bundle verified local Whisper ASR
        shell: bash
        run: |
          set -euo pipefail
          ASR_DIR="police-app/src/main/assets/asr/whisper-tiny-int8"
          mkdir -p "$ASR_DIR"
          BASE="https://huggingface.co/csukuangfj/sherpa-onnx-whisper-tiny/resolve/main"

          curl --fail --location --retry 5 --connect-timeout 20 --max-time 240 \
            "$BASE/tiny-encoder.int8.onnx?download=true" \
            --output "$ASR_DIR/tiny-encoder.int8.onnx"
          curl --fail --location --retry 5 --connect-timeout 20 --max-time 300 \
            "$BASE/tiny-decoder.int8.onnx?download=true" \
            --output "$ASR_DIR/tiny-decoder.int8.onnx"
          curl --fail --location --retry 5 --connect-timeout 20 --max-time 120 \
            "$BASE/tiny-tokens.txt?download=true" \
            --output "$ASR_DIR/tiny-tokens.txt"

          printf '%s  %s\n' \
            'd24fb083ae3b1041fc24e97971d60e280c9342201fbb67b0ab428a8b4a51a434' \
            "$ASR_DIR/tiny-encoder.int8.onnx" | sha256sum -c -
          printf '%s  %s\n' \
            'd2fece8dd42771f1df975c6c0445770d0c292bf7547c2cae04a6c0cc57540925' \
            "$ASR_DIR/tiny-decoder.int8.onnx" | sha256sum -c -
          printf '%s  %s\n' \
            'b34b360dbb493e781e479794586d661700670d65564001f23024971d1f2fa126' \
            "$ASR_DIR/tiny-tokens.txt" | sha256sum -c -

          test "$(stat -c%s "$ASR_DIR/tiny-encoder.int8.onnx")" -ge 12000000
          test "$(stat -c%s "$ASR_DIR/tiny-decoder.int8.onnx")" -ge 85000000
          test "$(stat -c%s "$ASR_DIR/tiny-tokens.txt")" -ge 700000
          echo "Verified Whisper Tiny INT8 is bundled; cloud transcription is not required."

      - name: Validate committed Saudi voice pack
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_bundled_natural_voice.py

      - name: Audit bundled speech before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import pathlib
          import struct
          import wave

          root = pathlib.Path('police-app/src/main')
          catalog = json.loads((root / 'assets/natural_voice_catalog.json').read_text(encoding='utf-8'))
          raw_dir = root / 'res/raw'
          expected = {f"voice_{entry['id']}.wav" for entry in catalog}
          actual = {p.name for p in raw_dir.glob('voice_*.wav')}
          if actual != expected:
              raise SystemExit(f'voice catalog mismatch: actual={sorted(actual)} expected={sorted(expected)}')
          if len(expected) != 15:
              raise SystemExit(f'expected exactly 15 catalog voices, got {len(expected)}')

          for name in sorted(expected):
              path = raw_dir / name
              if path.stat().st_size <= 3000:
                  raise SystemExit(f'{name}: unexpectedly small')
              with wave.open(str(path), 'rb') as wav:
                  if wav.getnchannels() != 1:
                      raise SystemExit(f'{name}: expected mono')
                  if wav.getsampwidth() != 2:
                      raise SystemExit(f'{name}: expected PCM16')
                  if wav.getframerate() != 24000:
                      raise SystemExit(f'{name}: expected 24000 Hz')
                  if wav.getnframes() <= 1000:
                      raise SystemExit(f'{name}: too short')
                  duration = wav.getnframes() / wav.getframerate()
                  if duration < 0.70:
                      raise SystemExit(f'{name}: duration too short ({duration:.2f}s)')
                  frames = wav.readframes(wav.getnframes())
              sample_count = len(frames) // 2
              if sample_count == 0:
                  raise SystemExit(f'{name}: empty PCM')
              samples = struct.unpack('<' + 'h' * sample_count, frames[:sample_count * 2])
              rms = math.sqrt(sum(s * s for s in samples) / sample_count)
              if rms <= 150:
                  raise SystemExit(f'{name}: effectively silent (RMS={rms:.1f})')
              print(f'{name}: {duration:.2f}s RMS={rms:.1f}')
          print(f'Audited {len(expected)} committed natural speech assets.')
          PY

      - name: Build Al-Shorti
        env:
          ALSHORTI_KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          ALSHORTI_KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          ALSHORTI_KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :police-app:assembleDebug

      - name: Verify APK contains local listening and natural speech
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls police-app/build/outputs/apk/debug/*.apk | head -1)
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import json
          import pathlib
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])
          catalog = json.loads(pathlib.Path('police-app/src/main/assets/natural_voice_catalog.json').read_text(encoding='utf-8'))
          expected_voice = {f"res/raw/voice_{entry['id']}.wav" for entry in catalog}
          expected_asr = {
              'assets/asr/whisper-tiny-int8/tiny-encoder.int8.onnx': 12_000_000,
              'assets/asr/whisper-tiny-int8/tiny-decoder.int8.onnx': 85_000_000,
              'assets/asr/whisper-tiny-int8/tiny-tokens.txt': 700_000,
          }
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing_voice = sorted(expected_voice - names)
              if missing_voice:
                  raise SystemExit(f'APK missing bundled natural voices: {missing_voice}')
              actual_voice = sorted(name for name in names if name.startswith('res/raw/voice_') and name.endswith('.wav'))
              if len(actual_voice) != 15:
                  raise SystemExit(f'APK expected 15 bundled voices, found {len(actual_voice)}')
              for name in actual_voice:
                  if len(archive.read(name)) <= 3000:
                      raise SystemExit(f'{name}: embedded file unexpectedly small')
              for name, minimum in expected_asr.items():
                  if name not in names:
                      raise SystemExit(f'APK missing local ASR asset: {name}')
                  if len(archive.read(name)) < minimum:
                      raise SystemExit(f'{name}: embedded ASR asset unexpectedly small')
          print('APK contains 15 natural speech resources and the complete local Whisper ASR model.')
          PY

      - name: Report APK size
        run: du -h police-app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlShorti-${{ env.VERSION_NAME }}-local-listening-living-scene
          path: police-app/build/outputs/apk/debug/*.apk
          retention-days: 30

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew --no-daemon :police-app:testDebugUnitTest

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Run lint
        run: ./gradlew --no-daemon :police-app:lintDebug
