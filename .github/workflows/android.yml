name: Al-Shorti Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: alshorti-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Load app version
        run: cat version.properties >> "$GITHUB_ENV"

      - name: Install pinned Saudi neural voice generator
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(find police-app/src/main/res/raw -maxdepth 1 -type f -name 'voice_*.wav' 2>/dev/null | wc -l)
          if [[ "$COUNT" -eq 15 ]]; then
            echo "Committed voice pack detected; external synthesis tools are not required."
            exit 0
          fi
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'edge-tts==7.2.8'
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Restore permanent signing key when configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALSHORTI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Permanent signing not configured; using Android debug certificate."
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/alshorti-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "ALSHORTI_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Prepare exact cinematic fallback frame
        shell: bash
        env:
          MASTER_FRAME_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png
        run: |
          set -euo pipefail
          DRAW_DIR="police-app/src/main/res/drawable-nodpi"
          mkdir -p "$DRAW_DIR"
          rm -f "$DRAW_DIR/cinematic_office_reference.jpg" "$DRAW_DIR/cinematic_office_reference.png"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 120 \
            "$MASTER_FRAME_URL" --output "$DRAW_DIR/cinematic_office_reference.png"
          test -s "$DRAW_DIR/cinematic_office_reference.png"
          echo "No cinematic MP4 is bundled into the APK."

      - name: Generate or validate bundled natural Saudi speech
        shell: bash
        env:
          ALSHORTI_EDGE_POLICE_VOICE: ar-SA-HamedNeural
          ALSHORTI_EDGE_POLICE_RATE: '-4%'
          ALSHORTI_EDGE_POLICE_PITCH: '-2Hz'
        run: |
          set -euo pipefail
          python3 tools/generate_bundled_natural_voice.py

      - name: Audit bundled speech before build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import pathlib
          import struct
          import wave

          root = pathlib.Path('police-app/src/main')
          catalog = json.loads((root / 'assets/natural_voice_catalog.json').read_text(encoding='utf-8'))
          raw_dir = root / 'res/raw'
          expected = {f"voice_{entry['id']}.wav" for entry in catalog}
          actual = {p.name for p in raw_dir.glob('voice_*.wav')}
          if actual != expected:
              raise SystemExit(f'voice catalog mismatch: actual={sorted(actual)} expected={sorted(expected)}')
          if len(expected) != 15:
              raise SystemExit(f'expected exactly 15 catalog voices, got {len(expected)}')

          for name in sorted(expected):
              path = raw_dir / name
              if path.stat().st_size <= 3000:
                  raise SystemExit(f'{name}: unexpectedly small')
              with wave.open(str(path), 'rb') as wav:
                  if wav.getnchannels() != 1:
                      raise SystemExit(f'{name}: expected mono')
                  if wav.getsampwidth() != 2:
                      raise SystemExit(f'{name}: expected PCM16')
                  if wav.getframerate() != 24000:
                      raise SystemExit(f'{name}: expected 24000 Hz')
                  if wav.getnframes() <= 1000:
                      raise SystemExit(f'{name}: too short')
                  duration = wav.getnframes() / wav.getframerate()
                  if duration < 0.70:
                      raise SystemExit(f'{name}: duration too short ({duration:.2f}s)')
                  frames = wav.readframes(wav.getnframes())
              sample_count = len(frames) // 2
              if sample_count == 0:
                  raise SystemExit(f'{name}: empty PCM')
              samples = struct.unpack('<' + 'h' * sample_count, frames[:sample_count * 2])
              rms = math.sqrt(sum(s * s for s in samples) / sample_count)
              if rms <= 150:
                  raise SystemExit(f'{name}: effectively silent (RMS={rms:.1f})')
              print(f'{name}: {duration:.2f}s RMS={rms:.1f}')
          print(f'Audited {len(expected)} natural speech assets.')
          PY

      - name: Persist validated voice pack to branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          ORIGINAL_SHA=$(git rev-parse HEAD)
          PACK="$RUNNER_TEMP/alshorti-validated-voice-pack"
          mkdir -p "$PACK"
          cp police-app/src/main/res/raw/voice_*.wav "$PACK/"

          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          mkdir -p police-app/src/main/res/raw
          cp "$PACK"/*.wav police-app/src/main/res/raw/
          git add police-app/src/main/res/raw/voice_*.wav

          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Bundle validated Saudi neural voice pack'
            git push origin "HEAD:$HEAD_BRANCH"
            echo "Validated voice pack persisted to $HEAD_BRANCH."
          else
            echo "Validated voice pack already committed."
          fi

          git checkout --detach "$ORIGINAL_SHA"
          mkdir -p police-app/src/main/res/raw
          cp "$PACK"/*.wav police-app/src/main/res/raw/

      - name: Build Al-Shorti
        env:
          ALSHORTI_KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          ALSHORTI_KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          ALSHORTI_KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
          ALSHORTI_GEMINI_STAFF_VOICE: ${{ secrets.ALSHORTI_GEMINI_STAFF_VOICE }}
        run: ./gradlew --no-daemon :police-app:assembleDebug

      - name: Verify APK contains all natural speech
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls police-app/build/outputs/apk/debug/*.apk | head -1)
          test -s "$APK"
          python3 - "$APK" <<'PY'
          import json
          import pathlib
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])
          catalog = json.loads(pathlib.Path('police-app/src/main/assets/natural_voice_catalog.json').read_text(encoding='utf-8'))
          expected = {f"res/raw/voice_{entry['id']}.wav" for entry in catalog}
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing = sorted(expected - names)
              actual = sorted(name for name in names if name.startswith('res/raw/voice_') and name.endswith('.wav'))
              if missing:
                  raise SystemExit(f'APK missing bundled natural voices: {missing}')
              if len(actual) != 15:
                  raise SystemExit(f'APK expected 15 bundled voices, found {len(actual)}')
              for name in actual:
                  if len(archive.read(name)) <= 3000:
                      raise SystemExit(f'{name}: embedded file unexpectedly small')
          print('APK contains all 15 non-empty natural speech resources.')
          PY

      - name: Report APK size
        run: du -h police-app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlShorti-${{ env.VERSION_NAME }}-guaranteed-audible
          path: police-app/build/outputs/apk/debug/*.apk
          retention-days: 30

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew --no-daemon :police-app:testDebugUnitTest

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Run lint
        run: ./gradlew --no-daemon :police-app:lintDebug
