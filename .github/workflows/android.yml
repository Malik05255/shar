name: Al-Shorti Android CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: alshorti-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Load app version
        run: cat version.properties >> "$GITHUB_ENV"

      - name: Check Gemini natural voice configuration
        id: voice
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing repository secret: GEMINI_API_KEY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore permanent signing key when configured
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ALSHORTI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Permanent signing not configured; using Android debug certificate."
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/alshorti-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          echo "ALSHORTI_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Prepare exact cinematic fallback frame
        shell: bash
        env:
          MASTER_FRAME_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png
        run: |
          set -euo pipefail
          DRAW_DIR="police-app/src/main/res/drawable-nodpi"
          mkdir -p "$DRAW_DIR"
          rm -f "$DRAW_DIR/cinematic_office_reference.jpg" "$DRAW_DIR/cinematic_office_reference.png"
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 120 \
            "$MASTER_FRAME_URL" --output "$DRAW_DIR/cinematic_office_reference.png"
          test -s "$DRAW_DIR/cinematic_office_reference.png"
          echo "No cinematic MP4 is bundled into the APK."

      - name: Verify exact cinematic CDN assets
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142010_21ee919f-e378-4db1-b7ed-66e367acc0e3.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142018_248ecb5a-3804-457a-9a43-9b19de5f8121.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_141957_53df74a5-4bcb-445d-95a5-69182cd4f0d5.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142642_29bd6e49-40ad-484b-97f2-ebed9197a923.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142734_345318c2-5f9c-4f87-b067-8ca5bb5c5b54.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_140952_4319b02c-dc65-4750-b24f-f5459350058b.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_142029_d4e858db-fdfa-46ce-a248-34ccf47f19de.mp4'
            'https://d8j0ntlcm91z4.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/hf_20260830_145806_3f9ed13a-6db3-41a4-a89a-34a383d9f5a3.mp4'
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/d332e06e-e71d-4a6f-bd09-25701099796e.mp4'
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/d974bddb-4396-45bb-b829-2bdc0c87aa12.mp4'
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/5f6f1b84-9230-4dc9-ad56-e87a3f18ded6.mp4'
          )
          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --location --head --connect-timeout 15 --max-time 30 "$url" >/dev/null
          done
          echo "All exact-quality cinematic CDN assets are reachable."

      - name: Verify Gemini Saudi-directed voice end-to-end
        if: steps.voice.outputs.ready == 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
        run: |
          set -euo pipefail
          VOICE="${ALSHORTI_GEMINI_POLICE_VOICE:-Gacrux}"
          RESPONSE="$RUNNER_TEMP/gemini-tts-response.json"
          WAV="$RUNNER_TEMP/alshorti-gemini-smoke.wav"
          PAYLOAD=$(python3 - <<PY
          import json
          voice = "${VOICE}"
          prompt = """Generate speech audio only. Do not speak these directions. Voice direction: Native Saudi man from Riyadh, natural conversational Najdi/Saudi accent, mature calm presence, warm with children, not a broadcaster. Speak exactly the transcript after [TRANSCRIPT].\n[TRANSCRIPT]\nهلا يا بطل، معك الشرطي. وش عندك؟"""
          print(json.dumps({
            "model": "gemini-3.1-flash-tts-preview",
            "input": prompt,
            "response_format": {"type": "audio"},
            "generation_config": {"speech_config": [{"voice": voice}]}
          }, ensure_ascii=False))
          PY
          )
          HTTP_CODE=$(curl --silent --show-error --location --output "$RESPONSE" --write-out '%{http_code}' --connect-timeout 15 --max-time 60 \
            -X POST 'https://generativelanguage.googleapis.com/v1beta/interactions' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H 'Api-Revision: 2026-05-20' \
            --data "$PAYLOAD")
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::Gemini TTS smoke test failed with HTTP ${HTTP_CODE}."
            exit 1
          fi
          python3 - <<PY
          import base64, json, wave
          data = json.load(open("$RESPONSE"))
          audio = None
          for step in data.get("steps", []):
              if step.get("type") == "model_output":
                  for block in step.get("content", []):
                      if block.get("type") == "audio" and block.get("data"):
                          audio = block; break
              if audio: break
          if not audio:
              raise SystemExit("Gemini response contained no audio")
          raw = base64.b64decode(audio["data"])
          if len(raw) < 3000:
              raise SystemExit("Gemini returned unexpectedly short audio")
          mime = (audio.get("mime_type") or audio.get("mimeType") or "").lower()
          rate = int(audio.get("sample_rate") or audio.get("sampleRate") or 24000)
          if mime.startswith("audio/wav") or raw[:4] == b"RIFF":
              open("$WAV", "wb").write(raw)
          else:
              with wave.open("$WAV", "wb") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(raw)
          with wave.open("$WAV", "rb") as w:
              assert w.getnchannels() == 1
              assert w.getframerate() >= 16000
              assert w.getnframes() > 1000
              print("Gemini voice:", w.getframerate(), "Hz,", w.getnframes(), "frames")
          PY
          rm -f "$RESPONSE" "$WAV"

      - name: Build Al-Shorti
        env:
          ALSHORTI_KEYSTORE_PASSWORD: ${{ secrets.ALSHORTI_KEYSTORE_PASSWORD }}
          ALSHORTI_KEY_ALIAS: ${{ secrets.ALSHORTI_KEY_ALIAS }}
          ALSHORTI_KEY_PASSWORD: ${{ secrets.ALSHORTI_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALSHORTI_GEMINI_POLICE_VOICE: ${{ secrets.ALSHORTI_GEMINI_POLICE_VOICE }}
          ALSHORTI_GEMINI_STAFF_VOICE: ${{ secrets.ALSHORTI_GEMINI_STAFF_VOICE }}
        run: ./gradlew --no-daemon :police-app:assembleDebug

      - name: Report APK size
        run: du -h police-app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        if: steps.voice.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AlShorti-${{ env.VERSION_NAME }}-debug
          path: police-app/build/outputs/apk/debug/*.apk

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew --no-daemon :police-app:testDebugUnitTest

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Run lint
        run: ./gradlew --no-daemon :police-app:lintDebug
