# trigger-v2
name: Apply radical audible-session patch

on:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - .github/workflows/radical-audio-session-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/silent-listening-living-office
          fetch-depth: 0

      - name: Patch session greeting and version
        shell: python
        run: |
          from pathlib import Path

          path = Path('police-app/src/main/kotlin/com/malik/alshurti/PoliceCallViewModel.kt')
          text = path.read_text(encoding='utf-8')

          old = '''    private var completedPoliceTurns = 0
    private var standingReplyActive = false
    private var conversationJob: Job? = null'''
          new = '''    private var completedPoliceTurns = 0
    private var standingReplyActive = false
    private var openingGreetingInFlight = false
    private var conversationJob: Job? = null'''
          assert old in text, 'state anchor missing'
          text = text.replace(old, new, 1)

          old = '''        completedPoliceTurns = 0
        ttsReady = false
        sessionStarted = false
        standingReplyActive = false'''
          new = '''        completedPoliceTurns = 0
        ttsReady = false
        sessionStarted = false
        standingReplyActive = false
        openingGreetingInFlight = false'''
          assert old in text, 'reset anchor missing'
          text = text.replace(old, new, 1)

          old = '''    private fun tryStartSession() {
        if (!microphonePermissionGranted || !ttsReady || sessionStarted) return
        sessionStarted = true

        // Deliberately no spoken greeting. The viewer enters an office that is already working.
        setPhase(CallPhase.LISTENING)
        _uiState.update {
            it.copy(
                mood = DogMood.CALM,
                viseme = MouthViseme.REST,
                replyText = "",
                heardText = "",
                errorMessage = null,
                firstGreetingDone = true,
                officeScene = it.officeScene.copy(
                    attention = DogAttention.PAPER,
                    dogAction = DogAction.REVIEW_FILE,
                    scenario = CinematicScenario.AMBIENT_WORK,
                    backgroundActivity = BackgroundActivity.PAPERWORK,
                    revision = it.officeScene.revision + 1
                )
            )
        }
        startAmbientLife()
        voiceEngine.startListening()
    }'''
          new = '''    private fun tryStartSession() {
        if (!microphonePermissionGranted || !ttsReady || sessionStarted) return
        sessionStarted = true
        openingGreetingInFlight = true
        stopAmbientLife()
        standingReplyActive = false
        setPhase(CallPhase.SPEAKING)
        _uiState.update {
            it.copy(
                mood = DogMood.TALKING,
                viseme = MouthViseme.REST,
                replyText = OPENING_GREETING,
                heardText = "",
                errorMessage = null,
                firstGreetingDone = true,
                officeScene = it.officeScene.copy(
                    cue = OfficeCue.NONE,
                    attention = DogAttention.CAMERA,
                    dogAction = DogAction.TALK_SEATED,
                    scenario = CinematicScenario.NONE,
                    backgroundActivity = BackgroundActivity.CALM_WORK,
                    phoneRinging = false,
                    revision = it.officeScene.revision + 1
                )
            )
        }
        publishObserverPlan(speakingPlan(false))
        voiceEngine.speak(OPENING_GREETING)
    }'''
          assert old in text, 'tryStartSession anchor missing'
          text = text.replace(old, new, 1)

          old = '''        completedPoliceTurns += 1
        if (standingReplyActive) {'''
          new = '''        if (openingGreetingInFlight) {
            openingGreetingInFlight = false
            standingReplyActive = false
            returnDogToWorkThenListen()
            return
        }

        completedPoliceTurns += 1
        if (standingReplyActive) {'''
          assert old in text, 'onTtsFinished anchor missing'
          text = text.replace(old, new, 1)

          old = '''        const val KEY_MODE = "voice_mode"
        const val STAND_UP_MS = 5_100L'''
          new = '''        const val KEY_MODE = "voice_mode"
        const val OPENING_GREETING = "هلا يا بطل، معك الشرطي. وش عندك؟"
        const val STAND_UP_MS = 5_100L'''
          assert old in text, 'companion anchor missing'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          version = Path('version.properties')
          v = version.read_text(encoding='utf-8')
          v = v.replace('VERSION_CODE=21', 'VERSION_CODE=22')
          v = v.replace('VERSION_NAME=0.6.4', 'VERSION_NAME=0.6.5')
          version.write_text(v, encoding='utf-8')

      - name: Verify patch shape
        run: |
          grep -q 'openingGreetingInFlight = true' police-app/src/main/kotlin/com/malik/alshurti/PoliceCallViewModel.kt
          grep -q 'voiceEngine.speak(OPENING_GREETING)' police-app/src/main/kotlin/com/malik/alshurti/PoliceCallViewModel.kt
          grep -q 'VERSION_NAME=0.6.5' version.properties
          ! grep -q 'Deliberately no spoken greeting' police-app/src/main/kotlin/com/malik/alshurti/PoliceCallViewModel.kt

      - name: Commit patched session
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add police-app/src/main/kotlin/com/malik/alshurti/PoliceCallViewModel.kt version.properties
          git diff --cached --quiet && exit 0
          git commit -m "Make opening session audibly greet with hybrid failover"
          git push origin HEAD:fix/silent-listening-living-office
