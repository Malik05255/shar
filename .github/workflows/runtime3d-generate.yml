name: Generate Runtime 3D Hero Candidate - Free Hunyuan

on:
  workflow_dispatch:
    inputs:
      reference_url:
        description: Approved cinematic police-dog master reference (public HTTPS PNG/JPG)
        required: true
        default: https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-generate.yml'

permissions:
  contents: read

jobs:
  generate-hero-free:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REFERENCE_URL: ${{ github.event.inputs.reference_url || 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IdaZt4rxgNGbXtsJ68cilp0L0M/8eb927a9-0c08-4a01-b3c7-fab9ca83e076.png' }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Enforce zero-cost provider
        shell: bash
        run: |
          set -euo pipefail
          echo 'Provider: official Tencent Hunyuan3D-2.1 Hugging Face Space (ZeroGPU).'
          echo 'No API key, billing secret, credit card, paid API, or paid overage is used by this workflow.'

      - name: Install public Gradio client
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2'

      - name: Generate high-fidelity textured GLB candidate for free
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime3d-candidate"
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from gradio_client import Client, handle_file

          target = Path(os.environ['RUNNER_TEMP']) / 'runtime3d-candidate' / 'police_dog.hunyuan.textured.glb'
          client = Client('tencent/Hunyuan3D-2.1', verbose=False)
          info = client.view_api(print_info=False, return_format='dict')
          named = info.get('named_endpoints') or {}
          endpoint = next((name for name in named if 'generation_all' in name), None)
          if not endpoint:
              raise SystemExit(f'Official Hunyuan Space does not expose generation_all. endpoints={list(named)}')
          print(f'Using free endpoint {endpoint}')

          result = client.predict(
              None,
              handle_file(os.environ['REFERENCE_URL']),
              None, None, None, None,
              30,       # full standard UI inference-step setting, not turbo shortcut
              7.5,
              1234,
              256,
              True,
              200000,
              False,
              api_name=endpoint,
          )
          if not isinstance(result, (tuple, list)) or len(result) < 2:
              raise SystemExit(f'Unexpected Hunyuan result: {type(result)} {result!r}')

          textured = result[1]
          if isinstance(textured, dict):
              textured = textured.get('path') or textured.get('name')
          textured = Path(str(textured))
          if not textured.exists():
              raise SystemExit(f'Textured Hunyuan GLB was not materialized: {textured}')
          shutil.copy2(textured, target)
          print(f'Candidate saved: {target} bytes={target.stat().st_size}')
          PY

      - name: Verify candidate GLB structure without accepting visual downgrade
        shell: bash
        run: |
          set -euo pipefail
          export CANDIDATE="$RUNNER_TEMP/runtime3d-candidate/police_dog.hunyuan.textured.glb"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from runtime3d.inspect_glb import read_glb_json

          path = Path(os.environ['CANDIDATE'])
          if path.stat().st_size < 1024 * 100:
              raise SystemExit(f'candidate is suspiciously small: {path.stat().st_size} bytes')
          doc = read_glb_json(path)
          meshes = doc.get('meshes') or []
          materials = doc.get('materials') or []
          images = doc.get('images') or []
          if not meshes:
              raise SystemExit('candidate contains no meshes')
          if not materials:
              raise SystemExit('candidate contains no materials')
          print(f'candidate structural gate passed: meshes={len(meshes)} materials={len(materials)} images={len(images)}')
          print('NOTE: structural success does NOT mean production acceptance; exact identity, fur, uniform, PBR, rig and animation still require authored review.')
          PY

      - name: Keep production gate closed
        shell: bash
        run: |
          set -euo pipefail
          echo 'This free Hunyuan output is intentionally NOT copied to police_dog.glb.'
          echo 'Production remains disabled until the candidate matches the approved cinematic reference and receives the required quadruped/facial rig and named animation clips.'

      - name: Upload free candidate for Blender finishing
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-police-dog-free-hunyuan-candidate
          path: ${{ runner.temp }}/runtime3d-candidate/*
          if-no-files-found: error
          retention-days: 14
