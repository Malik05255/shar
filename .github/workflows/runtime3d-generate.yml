name: Generate Runtime 3D Hero Candidate - Free Provider Pool

on:
  workflow_dispatch:
    inputs:
      reference_url:
        description: Photorealistic isolated K9 hero candidate (public HTTPS PNG/JPG/WEBP)
        required: true
        default: https://raw.githubusercontent.com/Malik05255/shar/5902631c5df905c8535bd150f40c6c1adcc294b4/runtime3d/reference_candidates/police_dog.photorealistic_biped_v1.webp
  # Deliberate one-shot trigger. Normal future runs remain workflow_dispatch-only
  # unless this marker is intentionally changed, so free GPU quota is not burned.
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - 'runtime3d/.provider-pool-run-once'

permissions:
  contents: read

jobs:
  free-provider-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REFERENCE_URL: ${{ github.event.inputs.reference_url || 'https://raw.githubusercontent.com/Malik05255/shar/5902631c5df905c8535bd150f40c6c1adcc294b4/runtime3d/reference_candidates/police_dog.photorealistic_biped_v1.webp' }}
      # Optional. Anonymous public Spaces remain usable when this secret is absent.
      # If supplied, this must be a normal Hugging Face account token; no billing token is required.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Enforce red lines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('runtime3d/free_provider_pool.json').read_text())
          assert registry['freeOnly'] is True
          assert registry['stopBeforePaid'] is True
          assert registry['qualityFloor']['allowLowPolyHero'] is False
          assert registry['qualityFloor']['allowSpriteHero'] is False
          print('FREE_ONLY=true')
          print('PAID_FALLBACK=false')
          print('QUALITY_DOWNGRADE=false')
          print('REFERENCE_CLASS=isolated-photorealistic-k9-candidate')
          PY

      - name: Install free provider clients
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2'

      - name: Run free provider pool with automatic failover
        id: pool
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/runtime3d-provider-pool"
          python3 runtime3d/free_provider_orchestrator.py \
            --reference-url "$REFERENCE_URL" \
            --output-dir "$RUNNER_TEMP/runtime3d-provider-pool"

      - name: Show provider rotation report
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/runtime3d-provider-pool/provider-pool-report.json"
          if [[ -f "$REPORT" ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'runtime3d-provider-pool' / 'provider-pool-report.json'
          r = json.loads(p.read_text())
          print(f"winner={r.get('winner')}")
          for a in r.get('attempts', []):
              print(f"{a.get('priority'):>3} {a.get('provider')}: {a.get('status')} - {a.get('reason', '')}")
          print(f"productionGate={r.get('productionGate')}")
          PY
          else
            echo 'Provider report was not produced.'
          fi

      - name: Upload provider-pool result and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-free-provider-pool-candidate
          path: ${{ runner.temp }}/runtime3d-provider-pool/*
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed when every free automated provider is unavailable
        if: steps.pool.outcome != 'success'
        run: |
          echo '::error::No free automated provider produced an acceptable GLB. Paid fallback is intentionally disabled.'
          exit 1

      - name: Keep production manifest closed
        run: |
          echo 'A successful candidate is still NOT production-ready.'
          echo 'Identity, isolated silhouette, fur, uniform, PBR, biped/facial rig, exact animation clips, Arabic lip-sync and physical Android acceptance remain mandatory.'
