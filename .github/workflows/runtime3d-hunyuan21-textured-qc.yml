name: Generate Hunyuan3D Textured Hero - Authenticated Free Pool

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-hunyuan21-textured-qc.yml'

permissions:
  contents: read
  actions: read

jobs:
  hunyuan-textured:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HERO_REFERENCE_RUN_ID: '33391759260'
      HERO_REFERENCE_ARTIFACT: Runtime3D-photorealistic-hero-reference-candidate
      HERO_REFERENCE_FILE: police_dog.hero_reference.fullbody.png
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enforce authenticated free-only gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo '::error::HF_TOKEN is required for authenticated free ZeroGPU quota'; exit 1; }
          echo 'PROVIDER_POOL=tencent/Hunyuan3D-2.1,tencent/Hunyuan3D-2'
          echo 'FREE_ONLY=true'
          echo 'PAID_FALLBACK=false'
          echo 'TRIPO_API_USED=false'
          echo 'PRODUCTION_ACTIVATION=false'
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('runtime3d/manifest.json').read_text())
          assert data.get('enabled') is False
          print('manifest.enabled=false')
          PY

      - name: Download exact approved hero reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HERO_REFERENCE_ARTIFACT }}
          path: ${{ runner.temp }}/hero-reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HERO_REFERENCE_RUN_ID }}

      - name: Verify reference
        shell: bash
        run: |
          set -euo pipefail
          REF="$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE"
          test -s "$REF"
          BYTES=$(stat -c%s "$REF")
          (( BYTES >= 10000 )) || { echo "::error::Reference too small: $BYTES"; exit 1; }
          echo "heroReferenceBytes=$BYTES"
          file "$REF"

      - name: Install free client
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2'

      - name: Generate Hunyuan textured candidate with automatic official fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hunyuan-textured"
          python3 runtime3d/hf_hunyuan21_textured_reference.py \
            --reference "$RUNNER_TEMP/hero-reference/$HERO_REFERENCE_FILE" \
            --output "$RUNNER_TEMP/hunyuan-textured/police_dog.hunyuan.textured_reference.glb" \
            --report "$RUNNER_TEMP/hunyuan-textured/police_dog.hunyuan.textured_reference.json"

      - name: Validate embedded material payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'runtime3d')
          from inspect_glb import read_glb_json
          root = Path(os.environ['RUNNER_TEMP']) / 'hunyuan-textured'
          p = root / 'police_dog.hunyuan.textured_reference.glb'
          rp = root / 'police_dog.hunyuan.textured_reference.json'
          report = json.loads(rp.read_text())
          d = read_glb_json(p)
          meshes=d.get('meshes') or []; materials=d.get('materials') or []; textures=d.get('textures') or []; images=d.get('images') or []
          accessors=d.get('accessors') or []
          vertices=0
          for mesh in meshes:
              for prim in mesh.get('primitives') or []:
                  pos=(prim.get('attributes') or {}).get('POSITION')
                  if isinstance(pos,int) and 0 <= pos < len(accessors): vertices += int(accessors[pos].get('count') or 0)
          space=report.get('space')
          summary={'space':space,'bytes':p.stat().st_size,'meshes':len(meshes),'vertices':vertices,
                   'materials':len(materials),'textures':len(textures),'images':len(images),'pbrChannels':report.get('pbrChannels'),
                   'attempts':report.get('attempts')}
          print(json.dumps(summary,indent=2))
          if space not in {'tencent/Hunyuan3D-2.1','tencent/Hunyuan3D-2'}: raise SystemExit('Unexpected provider output')
          if not meshes or vertices < 100000: raise SystemExit('Geometry floor failed')
          if not materials or not textures or not images: raise SystemExit('Embedded material payload missing')
          if 'baseColorTexture' not in (report.get('pbrChannels') or []): raise SystemExit('Base color texture missing')
          if report.get('freeOnly') is not True or report.get('paidFallbackAllowed') is not False: raise SystemExit('Free-only policy failed')
          if report.get('productionReady') is not False: raise SystemExit('Candidate must remain non-production')
          print('HUNYUAN_TEXTURED_STRUCTURAL_GATE=PASS')
          print('PRODUCTION_GATE=CLOSED')
          PY

      - name: Upload Hunyuan textured candidate
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-hunyuan-textured-reference-candidate
          path: ${{ runner.temp }}/hunyuan-textured/*
          if-no-files-found: error
          retention-days: 14

      - name: Keep production manifest closed
        run: |
          echo 'VISUAL_MULTI_ANGLE_QC_REQUIRED=true'
          echo 'PRODUCTION_GATE=CLOSED'
