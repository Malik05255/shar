name: Generate Runtime 3D Hero Texture Candidate - Free Pool

on:
  workflow_dispatch:
  push:
    branches:
      - fix/silent-listening-living-office
    paths:
      - '.github/workflows/runtime3d-texture.yml'
      - 'runtime3d/free_texture_candidate.py'
      - 'runtime3d/.texture-run-once'

permissions:
  contents: read
  actions: read

jobs:
  free-texture-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HERO_REFERENCE_RUN_ID: '33391759260'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Enforce red lines
        shell: bash
        run: |
          set -euo pipefail
          echo 'FREE_ONLY=true'
          echo 'PAID_FALLBACK=false'
          echo 'AUTO_REPLACE_HERO=false'
          echo 'PRODUCTION_ACTIVATION=false'

      - name: Download exact hero reference artifact
        uses: actions/download-artifact@v4
        with:
          name: Runtime3D-photorealistic-hero-reference-candidate
          path: ${{ runner.temp }}/hero-reference
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HERO_REFERENCE_RUN_ID }}

      - name: Verify reference
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/hero-reference/police_dog.hero_reference.fullbody.png"
          test -s "$SRC"
          BYTES=$(stat -c%s "$SRC")
          (( BYTES >= 10000 )) || { echo "::error::Hero reference too small: $BYTES"; exit 1; }
          cp "$SRC" "$RUNNER_TEMP/hero-reference.webp"
          file "$RUNNER_TEMP/hero-reference.webp"

      - name: Install free provider clients
        run: python3 -m pip install --quiet 'gradio_client>=1.3,<2' 'Pillow>=10,<12'

      - name: Rotate legitimate free texture providers
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/runtime3d-texture"
          python3 runtime3d/free_texture_candidate.py \
            --reference-file "$RUNNER_TEMP/hero-reference.webp" \
            --output-dir "$RUNNER_TEMP/runtime3d-texture"
          RC=$?
          echo "TEXTURE_POOL_EXIT=$RC" >> "$GITHUB_ENV"
          exit 0

      - name: Show texture provider report
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/runtime3d-texture/texture-provider-report.json"
          if [[ -f "$REPORT" ]]; then cat "$REPORT"; else echo 'No texture report produced.'; fi

      - name: Upload free texture candidate and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runtime3D-police-dog-free-texture-candidate
          path: ${{ runner.temp }}/runtime3d-texture/*
          if-no-files-found: warn
          retention-days: 14

      - name: Fail closed if all free providers are unavailable
        shell: bash
        run: |
          if [[ "${TEXTURE_POOL_EXIT:-2}" != "0" ]]; then
            echo '::error::No legitimate automated free texture provider succeeded. Paid fallback is disabled.'
            exit 1
          fi
          echo 'FREE_TEXTURE_CANDIDATE_AVAILABLE=true'
          echo 'AUTO_REPLACE_HERO=false'
          echo 'PRODUCTION_GATE=CLOSED'
