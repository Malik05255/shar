services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    # Uncomment on a Docker host with NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  alshorti-voice:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 8787
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen3:8b
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-cpu}
      CHATTERBOX_EXAGGERATION: ${CHATTERBOX_EXAGGERATION:-0.55}
      CHATTERBOX_CFG_WEIGHT: ${CHATTERBOX_CFG_WEIGHT:-0.35}
      REFERENCE_VOICE: /app/voices/police_ar.wav
    volumes:
      - ./voices:/app/voices:ro
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - ollama

volumes:
  ollama-data:
  hf-cache:
